.rvbox blockquote{margin:0;padding:12px;border:1px solid #dfe6ee;border-radius:12px;background:#f7f9fc}.rvbox blockquote p{margin:6px 0;white-space:pre-wrap}.rvbox cite{font-style:normal;font-size:.9rem;color:#4a5b70}
.fbcard{max-width:520px;margin:24px auto 0;padding:20px;background:#fff;border:1px solid #dfe6ee;border-radius:14px;color:#18283c;overflow-wrap:anywhere}
.fbcard h2{margin:0 0 4px}.fbcard p{margin:6px 0}.fbcard .fbq{margin:16px 0 4px;font-weight:700;display:block}.fbcard .fbsub{color:#4a5b70;font-size:.95em}
.fbstars{display:flex;gap:4px}.fbstars button{width:46px;height:46px;padding:0;border:0;background:none;font-size:32px;line-height:1;color:#c5cfdb;cursor:pointer}
.fbstars button.on{color:#e6a700}.fbstars button:focus-visible,.fbchips button:focus-visible{outline:3px solid #407cbe;outline-offset:2px;border-radius:8px}
.fbprod{display:grid;gap:2px;margin:8px 0;padding:8px 0;border-top:1px solid #edf1f6}.fbprod span{font-size:.95em}
.fbchips{display:flex;flex-wrap:wrap;gap:8px}.fbchips button{min-height:44px;padding:8px 16px;border:1.5px solid #75869d;border-radius:999px;background:#fff;color:#1F3864;font:inherit;font-weight:600;cursor:pointer}
.fbchips button[aria-pressed=true]{background:#1F3864;border-color:#1F3864;color:#fff}
.fbcard textarea,.fbcard input[type=text]{width:100%;box-sizing:border-box;border:1px solid #b9c5d4;border-radius:10px;padding:10px;font:inherit;font-size:16px}
.fbcard label.fbr{display:flex;gap:10px;align-items:flex-start;margin:8px 0;font-weight:400}.fbcard label.fbr input{margin-top:4px}
.fbcard .fbgo{display:grid;place-items:center;width:100%;min-height:50px;margin-top:18px;border:0;border-radius:10px;background:#1F3864;color:#fff;font:inherit;font-weight:700;cursor:pointer}
.fbcard .fbgo:disabled{opacity:.6;cursor:default}.fbcard .fberr{color:#b02a1d;font-weight:700;min-height:1.2em}.fbcard .fbhp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.fbcard .fbedit{margin-top:10px;min-height:44px;padding:8px 16px;border:1.5px solid #1F3864;border-radius:10px;background:#fff;color:#1F3864;font:inherit;font-weight:700;cursor:pointer}
.multi-open{display:flex;align-items:center;gap:6px;justify-self:start;min-height:44px;padding:4px 2px;border:0;background:none;color:var(--navy);font:inherit;font-size:15px;font-weight:600;cursor:pointer}.multi-open:focus-visible{outline:3px solid #407cbe;outline-offset:2px;border-radius:6px}
.multi-sheet{max-width:min(520px,calc(100% - 24px))}

.mrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.mrow.na{opacity:.55}.mrow.bad .mname span.mmin{color:#b02a1d;font-weight:700}
.mname{min-width:0;display:grid;gap:2px;overflow-wrap:anywhere}.mname span{font-size:13px;color:var(--muted)}
.mstep{display:flex;align-items:center;gap:4px;flex:none}

.mstep button:disabled{opacity:.4;cursor:default}
.mstep input{width:56px;min-height:40px;text-align:center;font:inherit;font-size:16px;border:1px solid var(--line);border-radius:8px}
.mfoot{position:sticky;bottom:0;background:var(--card);padding:10px 16px max(12px,env(safe-area-inset-bottom));border-top:1px solid var(--line);display:grid;gap:6px}

.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
