.tracking{max-width:520px;margin:24px auto;padding:20px;background:#fff;border:1px solid #dfe6ee;border-radius:14px;color:#18283c;overflow-wrap:anywhere}
.tracking h2{margin:4px 0}.tracking p{margin:8px 0}.tracking ul{padding-left:20px}.tracking li{margin:8px 0}
.tracking .tl{list-style:none;margin:16px 0 8px;padding:0}.tracking .tl li{position:relative;margin:0;padding:0 0 18px 34px;min-height:26px}
.tracking .tl li::before{content:"";position:absolute;left:10px;top:22px;bottom:-4px;width:2px;background:#cfd8e3}.tracking .tl li:last-child{padding-bottom:0}.tracking .tl li:last-child::before{display:none}
.tracking .tl li.done::before{background:#1F3864}
.tracking .tl .dot{position:absolute;left:0;top:1px;width:22px;height:22px;border-radius:50%;border:2px solid #cfd8e3;background:#fff;box-sizing:border-box;display:grid;place-items:center;font-size:12px;line-height:1;color:#fff}
.tracking .tl li.done .dot{background:#1F3864;border-color:#1F3864}.tracking .tl li.done .dot::after{content:"✓"}
.tracking .tl li.current .dot,.tracking .tl li.partial .dot{border-color:#1F3864;box-shadow:0 0 0 4px rgba(31,56,100,.15)}.tracking .tl li.partial .dot{background:linear-gradient(90deg,#1F3864 50%,#fff 50%)}
.tracking .tl li.stopped .dot{background:#b3261e;border-color:#b3261e}.tracking .tl li.stopped .dot::after{content:"✕"}
.tracking .tl li.upcoming{color:#6b7a8d}.tracking .tl .tt{font-weight:700;display:block}.tracking .tl .ts{display:block;font-size:.9em;color:#4a5b70}.tracking .tl li.upcoming .ts{color:#7d8b9d}

.rvbox{max-width:760px;margin:26px auto 0;padding:18px;background:#fff;border:1px solid var(--line);border-radius:14px;color:#18283c;overflow-wrap:anywhere}
.rvbox h2{margin:0 0 6px;font-size:1.15rem}.rvbox .rvtop{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:baseline}.rvbox .rvbig{font-size:1.6rem;font-weight:800;color:var(--navy)}
.rvbox .rvst{color:#c58a00;letter-spacing:2px}.rvbox .rvsub{color:#4a5b70;font-size:.95rem}.rvbox .rvq{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:14px}
.rvbox blockquote{margin:0;padding:12px;border:1px solid #dfe6ee;border-radius:12px;background:#f7f9fc}.rvbox blockquote p{margin:6px 0;white-space:pre-wrap}.rvbox cite{font-style:normal;font-size:.9rem;color:#4a5b70}
.inst-wrap{position:fixed;inset:0;z-index:99999;display:flex;align-items:flex-end;justify-content:center}
.inst-back{position:absolute;inset:0;background:rgba(15,25,45,.5)}
.inst{position:relative;width:100%;max-width:520px;background:#fff;color:#18283c;border-radius:22px 22px 0 0;padding:10px 20px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -10px 40px rgba(0,0,0,.25);animation:instup .28s ease-out;outline:0;max-height:92vh;overflow:auto}
@keyframes instup{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.inst{animation:none}}
@media (min-width:640px){.inst-wrap{align-items:center}.inst{border-radius:22px;padding-bottom:20px}}
.inst-grab{display:block;width:44px;height:5px;border-radius:3px;background:#d5dce6;margin:0 auto 14px}
.inst-head{display:flex;gap:14px;align-items:center}.inst-head img{width:64px;height:64px;border-radius:16px;flex:none}
.inst-head h2{margin:0;font-size:1.25rem;color:var(--navy,#1F3864)}.inst-head p{margin:2px 0 0;color:#5a6b80;font-size:.95rem;overflow-wrap:anywhere}
.inst-feats{list-style:none;margin:16px 0;padding:0;display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.inst-feats li{background:#f4f7fb;border-radius:14px;padding:12px 6px;text-align:center;font-size:.88rem;font-weight:600;line-height:1.25}
.inst-feats svg{display:block;margin:0 auto 8px;width:40px;height:40px;padding:9px;box-sizing:border-box;border-radius:50%;background:#e3ebf6;color:var(--navy,#1F3864)}
.inst-steps{margin:0 0 14px;padding:12px 14px 12px 34px;background:#f4f7fb;border-radius:14px;line-height:1.5;font-size:.95rem}
.inst-steps svg{width:18px;height:18px;vertical-align:-3px;color:var(--navy,#1F3864)}
.inst button{font:inherit;cursor:pointer;display:block;width:100%;min-height:48px;border-radius:14px;border:0}
.inst .inst-go{background:var(--navy,#1F3864);color:#fff;font-weight:700;font-size:1.05rem;display:flex;align-items:center;justify-content:center;gap:8px}
.inst .inst-later{background:none;color:#4a5b70;font-weight:600;margin-top:6px}.inst .inst-never{background:none;color:#7a8898;font-size:.88rem;min-height:44px}
.inst button:focus-visible{outline:3px solid #c9a227;outline-offset:2px}
.findbox{max-width:760px;margin:12px auto 0;padding:0 2px}
.findtoggle{background:none;border:0;padding:8px 0;color:var(--navy,#1F3864);font:inherit;font-weight:700;cursor:pointer;min-height:44px;display:inline-flex;align-items:center;gap:6px}
.findtoggle:focus-visible,.findbox input:focus-visible,.findbox button:focus-visible{outline:3px solid #c9a227;outline-offset:2px}
.findcard{background:#fff;border:1px solid var(--line,#dfe6ee);border-radius:14px;padding:14px;color:#18283c}
.findcard label{display:block;font-weight:700;margin:0 0 6px}.findcard label+.findrow{margin-top:0}
.findrow{display:flex;gap:8px;flex-wrap:wrap}.findrow input{flex:1 1 220px;min-height:48px;border:1px solid #b9c4d2;border-radius:12px;padding:0 12px;font:inherit;min-width:0}
.findrow button{min-height:48px;border:0;border-radius:12px;background:var(--navy,#1F3864);color:#fff;font:inherit;font-weight:700;padding:0 18px;cursor:pointer}
.findrow button[disabled]{opacity:.6}.findact{margin-top:12px}.findact button{flex:1 1 100%}
.findphone{margin-top:12px}.findmsg{margin:10px 0 0;min-height:1.2em;color:#9a3412;font-size:.95rem}.findhelp{margin:8px 0 0;color:#4a5b70;font-size:.92rem}.findhelp a{color:var(--navy,#1F3864);font-weight:700}
.fbcard{max-width:520px;margin:24px auto 0;padding:20px;background:#fff;border:1px solid #dfe6ee;border-radius:14px;color:#18283c;overflow-wrap:anywhere}
.fbcard h2{margin:0 0 4px}.fbcard p{margin:6px 0}.fbcard .fbq{margin:16px 0 4px;font-weight:700;display:block}.fbcard .fbsub{color:#4a5b70;font-size:.95em}
.fbstars{display:flex;gap:4px}.fbstars button{width:46px;height:46px;padding:0;border:0;background:none;font-size:32px;line-height:1;color:#c5cfdb;cursor:pointer}
.fbstars button.on{color:#e6a700}.fbstars button:focus-visible,.fbchips button:focus-visible{outline:3px solid #407cbe;outline-offset:2px;border-radius:8px}
.fbprod{display:grid;gap:2px;margin:8px 0;padding:8px 0;border-top:1px solid #edf1f6}.fbprod span{font-size:.95em}
.fbchips{display:flex;flex-wrap:wrap;gap:8px}.fbchips button{min-height:44px;padding:8px 16px;border:1.5px solid #75869d;border-radius:999px;background:#fff;color:#1F3864;font:inherit;font-weight:600;cursor:pointer}
.fbchips button[aria-pressed=true]{background:#1F3864;border-color:#1F3864;color:#fff}
.fbcard textarea,.fbcard input[type=text]{width:100%;box-sizing:border-box;border:1px solid #b9c5d4;border-radius:10px;padding:10px;font:inherit;font-size:16px}
.fbcard label.fbr{display:flex;gap:10px;align-items:flex-start;margin:8px 0;font-weight:400}.fbcard label.fbr input{margin-top:4px}
.fbcard .fbgo{display:grid;place-items:center;width:100%;min-height:50px;margin-top:18px;border:0;border-radius:10px;background:#1F3864;color:#fff;font:inherit;font-weight:700;cursor:pointer}
.fbcard .fbgo:disabled{opacity:.6;cursor:default}.fbcard .fberr{color:#b02a1d;font-weight:700;min-height:1.2em}.fbcard .fbhp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.fbcard .fbedit{margin-top:10px;min-height:44px;padding:8px 16px;border:1.5px solid #1F3864;border-radius:10px;background:#fff;color:#1F3864;font:inherit;font-weight:700;cursor:pointer}
.multi-open{display:flex;align-items:center;gap:6px;justify-self:start;min-height:44px;padding:4px 2px;border:0;background:none;color:var(--navy);font:inherit;font-size:15px;font-weight:600;cursor:pointer}.multi-open:focus-visible{outline:3px solid #407cbe;outline-offset:2px;border-radius:6px}
.multi-sheet{max-width:min(520px,calc(100% - 24px))}
#multiBody{padding:0 16px 4px}.mhint{margin:8px 0 2px;font-size:13px;color:var(--muted)}
.mrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.mrow.na{opacity:.55}.mrow.bad .mname span.mmin{color:#b02a1d;font-weight:700}
.mname{min-width:0;display:grid;gap:2px;overflow-wrap:anywhere}.mname span{font-size:13px;color:var(--muted)}
.mstep{display:flex;align-items:center;gap:4px;flex:none}
.mstep button{width:40px;height:40px;padding:0;border:1px solid #75869d;border-radius:10px;background:#fff;color:#203a60;font:inherit;font-size:20px;cursor:pointer}
.mstep button:disabled{opacity:.4;cursor:default}
.mstep input{width:56px;min-height:40px;text-align:center;font:inherit;font-size:16px;border:1px solid var(--line);border-radius:8px}
.mfoot{position:sticky;bottom:0;background:var(--card);padding:10px 16px max(12px,env(safe-area-inset-bottom));border-top:1px solid var(--line);display:grid;gap:6px}
.mfoot p{margin:0}.mfoot .mnote{font-size:13px;color:#b02a1d}
.mfoot .askbig,#reviewBody .askbig.sec{display:grid;place-items:center;width:100%;min-height:48px;border:0;border-radius:10px;background:var(--navy);color:#fff;font:inherit;font-weight:700}
.mfoot .askbig:disabled{opacity:.55;cursor:default}
#reviewBody .askbig.sec{background:#fff;color:var(--navy);border:1.5px solid var(--navy)}
.review-line .rm{margin-left:auto}
#reviewBody .askbig:disabled,.purchase-actions .askbig:disabled{opacity:.55;cursor:default}
.purchase-actions button.askbig{border:0;font:inherit;font-weight:700;padding:8px 12px}
.browse-controls :is(button,select):focus-visible,.review-line button:focus-visible{outline:3px solid #407cbe;outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
</style>
</head>
<body>
<header><div class="in"><div class="brand"><img id="logo" alt="" hidden><div class="bt"><h1 id="nm">AH CHINA ORDERS</h1><div class="sub" id="sub">Products in stock</div><div class="em" id="em" hidden></div></div></div><div class="acts" id="acts"></div></div></header>
<main>
  <section class="findbox" id="findbox" aria-label="Track your order">
    <button type="button" class="findtoggle" id="findToggle" aria-expanded="false" aria-controls="findCard">Already ordered? Track your order <span aria-hidden="true">›</span></button>
    <form class="findcard" id="findCard" novalidate hidden>
      <label for="findIn">Tracking link, tracking number, or order number</label>
      <div class="findrow"><input id="findIn" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Paste your link, or type your order number"></div>
      <div class="findphone" id="findPhoneWrap" hidden><label for="findPhone">Phone number used for the order</label><div class="findrow"><input id="findPhone" type="tel" inputmode="tel" autocomplete="tel" placeholder="e.g. 7001111"></div></div>
      <div class="findrow findact"><button type="submit" id="findGo">Find order</button></div>
      <p class="findmsg" id="findMsg" role="status" aria-live="polite"></p>
      <p class="findhelp">Can’t find it? <a id="findWa" href="#" rel="noopener">WhatsApp us</a></p>
    </form>
  </section>
  <div class="tools" id="tools" hidden><input type="search" id="q" placeholder="Search: name, size or code" aria-label="Search the products"><div class="browse-controls">
    <select id="browseFilter" aria-label="Filter products"><option value="all">All products</option><option value="group">On group order</option><option value="promo">On promotion</option><option value="soon" hidden>Estimated soon</option><option value="soon2" hidden>Estimated later</option></select>
  </div><div class="chips" id="chips" role="group" aria-label="Groups"></div></div>
  <div class="count" id="count" aria-live="polite"></div>
  <div id="out"><div class="msg">Loading the products…</div></div>
  <section class="rvbox" id="rv" hidden aria-label="Customer reviews"></section>
  <p class="note" id="foot">Prices in Dalasi. Choose your product, pay a deposit, and we bring it from China for you.</p>
  <a class="fbfoot" id="fbFoot" target="_blank" rel="noopener noreferrer" hidden><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M24 12a12 12 0 1 0-13.9 11.9v-8.4H7.1V12h3V9.4c0-3 1.8-4.7 4.5-4.7 1.3 0 2.7.2 2.7.2v3h-1.5c-1.5 0-2 .9-2 1.9V12h3.4l-.5 3.5h-2.9v8.4A12 12 0 0 0 24 12z"/></svg><span>Our Facebook page</span></a>
</main>
<footer class="cr"><span id="crL"></span><span>All rights reserved.</span></footer>
<div class="ov" id="ov" hidden><div class="dlg" id="dlg" role="dialog" aria-modal="true" aria-labelledby="dlgT"></div></div>
<dialog class="order-guide" id="orderingGuide" aria-labelledby="orderingGuideTitle">
  <div class="order-guide-heading">
    <h2 id="orderingGuideTitle">How ordering works</h2>
    <button type="button" id="orderGuideClose" aria-label="Close ordering guide" autofocus>✕</button>
  </div>
  <div id="orderingGuideBody"></div>
</dialog>
<dialog class="order-guide order-review" id="orderReview" aria-labelledby="reviewTitle">
  <div class="order-guide-heading"><h2 id="reviewTitle">Review your order</h2><button type="button" id="closeReview" aria-label="Close order review" autofocus>✕</button></div>
  <div id="reviewBody"></div>
</dialog>
<dialog class="order-guide order-review multi-sheet" id="multiSheet" aria-labelledby="multiTitle">
  <div class="order-guide-heading"><h2 id="multiTitle">Select options</h2><button type="button" id="closeMulti" aria-label="Close option selection" autofocus>✕</button></div>
  <div id="multiBody"></div>
  <div class="mfoot" id="multiFoot"></div>
</dialog>
