<style>
:root{--navy:#1F3864;--ink:#14202e;--muted:#5b6778;--line:#dfe5ee;--bg:#f3f5f9;--card:#fff;--ask:#1F3864;--target:#0f7a43;--target-soft:#e3f4ea;--gold:#f59e0b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 "Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--navy);color:#fff;padding:20px 16px 18px}
header .in,main{max-width:960px;margin:0 auto}
h1{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:28px;line-height:1.1;margin:0 0 4px;letter-spacing:-.01em}
.sub{opacity:.85;font-size:14px}
.brand{display:flex;align-items:center;gap:12px}.bt{min-width:0}
#logo{flex:none;width:60px;height:60px;object-fit:contain;background:#fff;border-radius:14px;padding:4px;box-sizing:border-box}
@media (min-width:640px){#logo{width:72px;height:72px}}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.acts a{display:inline-flex;align-items:center;gap:6px;min-height:42px;padding:8px 14px;border-radius:999px;font-weight:700;text-decoration:none;font-size:15px}
.acts a.fbi{padding:8px;min-width:42px;justify-content:center;background:#1877f2;color:#fff}
.fbfoot[hidden]{display:none}
.fbfoot{display:inline-flex;align-items:center;gap:6px;margin-top:8px;color:#1877f2;font-weight:700;text-decoration:none;font-size:14px}
.wa{background:#fff;color:var(--navy)}.call{border:1px solid rgba(255,255,255,.5);color:#fff}
main{padding:14px 16px 40px}
.tools{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 8px}
input[type=search]{width:100%;font:inherit;font-size:17px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chips button{flex:none;font:inherit;font-size:14px;font-weight:700;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:6px 12px;min-height:36px;cursor:pointer}
.chips button[aria-pressed=true]{background:var(--navy);border-color:var(--navy);color:#fff}
.count{color:var(--muted);font-size:14px;margin:6px 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.ph{aspect-ratio:1/1;background:#eef2f6;display:flex;align-items:center;justify-content:center;color:var(--muted);font-weight:700;letter-spacing:.04em}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.nm{font-weight:700;line-height:1.25;overflow-wrap:anywhere}
.tag{align-self:flex-start;justify-self:start;font-size:12px;font-weight:700;color:#6b4100;background:#fdf0d5;border:1px solid #f3d9a4;border-radius:8px;padding:2px 9px;line-height:1.4}
.card .tag{font-size:11px;padding:1px 7px}
.sz{font-size:13px;color:var(--muted)}
.pr{display:grid;gap:4px;margin-top:auto}
.pr>div{display:flex;justify-content:space-between;align-items:baseline;gap:6px;border-radius:9px;padding:5px 8px}
.pr .k{font-size:12px;font-weight:700}
.pr .v{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:17px;line-height:1.1;white-space:nowrap}
.p-price{background:#e8edf6;color:var(--ask)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:13px}
.left{font-weight:700;color:var(--muted)}
.dep{font-size:13px;color:var(--muted);margin-top:4px}.dep b{color:var(--ink)}
.howto{background:#eef3fb;border-radius:12px;padding:10px 12px;font-size:14px;line-height:1.45;margin:10px 0 4px}
.ask{color:var(--navy);font-weight:700;text-decoration:none}
.was{text-decoration:line-through;color:#6b7280;font-weight:400;font-size:.78em;margin-right:6px}
.tag.promo{color:#8a1c12;background:#fdecea;border-color:#f3b9b3}
.bulk{margin:0 0 10px;padding:10px 12px;border-radius:10px;background:#fff6dc;border:1px solid #e3c36a;color:#4a3500;font-size:14px;font-weight:600;line-height:1.4}.goal.mb{font-weight:700}
.win{font-size:13px;font-weight:700;color:#14532d;background:#e6f4ea;border:1px solid #a8d5b5;border-radius:8px;padding:5px 10px;margin-top:6px;line-height:1.35}.win.urgent{color:#8a1c12;background:#fdecea;border-color:#f3b9b3}.win.soon{color:#6b4100;background:#fdf0d5;border-color:#f3d9a4}.win.closed{color:#4b5563;background:#eef0f3;border-color:#d1d5db}
.goal{margin-top:6px;font-size:13px;font-weight:700}.goal .gb{height:8px;border-radius:999px;background:#e5e7eb;overflow:hidden;margin-bottom:3px}.goal .gb i{display:block;height:100%;background:#1b7f3b}
.msg{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;text-align:center;color:var(--muted)}
.msg button{margin-top:12px;font:inherit;font-weight:700;border:0;border-radius:10px;background:var(--navy);color:#fff;padding:10px 18px;min-height:44px;cursor:pointer}
.note{color:var(--muted);font-size:13px;margin-top:18px;text-align:center;white-space:pre-line;overflow-wrap:anywhere}
.opn{font-size:13px;color:var(--muted);margin-top:4px}
.oh{font-size:14px;font-weight:700;margin:12px 0 6px}
.oc{display:flex;flex-wrap:wrap;gap:8px}
.oc button{font:inherit;font-size:14px;text-align:left;border:1.5px solid var(--line);background:#f3f4f6;color:var(--ink);border-radius:10px;padding:8px 12px;min-height:40px;cursor:pointer;overflow-wrap:anywhere}
.oc button[aria-pressed=true]{border-color:#c0392b;background:#fdecea;color:#b02a1d;font-weight:700}
.oc button.alt{opacity:.5;color:#8a919c;background:#eceef1;border-style:dashed;cursor:not-allowed}
.more{font:inherit;font-size:14px;font-weight:700;border:1px solid var(--navy);background:#fff;color:var(--navy);border-radius:10px;padding:6px 10px;min-height:40px;cursor:pointer;width:100%}
.more:hover{background:#e8edf6}
.badge{position:absolute;right:8px;bottom:8px;background:rgba(10,18,30,.72);color:#fff;font-size:12px;font-weight:700;border-radius:999px;padding:3px 8px}
.ph{position:relative}
.gal{position:relative;background:#eef2f6;margin-top:-60px}
.track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.track::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;display:flex;align-items:center;justify-content:center;height:min(60vh,520px)}
.slide img{width:100%;height:100%;object-fit:contain;display:block}
.slide.wait{color:var(--muted);font-weight:700;font-size:14px}
.gnav{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:999px;border:0;background:rgba(255,255,255,.88);color:var(--ink);font-size:20px;font-weight:700;cursor:pointer;display:none}
.gnav.prev{left:8px}.gnav.next{right:8px}
.gcount{position:absolute;left:10px;bottom:10px;background:rgba(10,18,30,.72);color:#fff;font-size:13px;font-weight:700;border-radius:999px;padding:3px 9px}
@media (hover:hover){.gal.multi .gnav{display:block}}
.badge.vb{right:auto;left:8px}
.vmini{position:absolute;right:10px;bottom:10px;width:40%;max-width:210px;border-radius:12px;overflow:hidden;background:#000;box-shadow:0 4px 14px rgba(0,0,0,.35);z-index:2}
.vmini img,.vmini video{display:block;width:100%;max-height:300px;object-fit:cover;background:#000}
.vmini.big{left:0;right:0;top:0;bottom:0;width:auto;max-width:none;border-radius:0}
.vmini.big video,.vmini.big img{height:100%;max-height:none;object-fit:contain}
.vplay{position:absolute;inset:0;margin:auto;width:52px;height:52px;border-radius:999px;border:0;background:rgba(255,255,255,.92);color:var(--ink);font-size:22px;cursor:pointer}
.vx,.vbig{position:absolute;top:6px;width:32px;height:32px;border-radius:999px;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:15px;cursor:pointer;z-index:3}
.vx{right:6px}.vbig{left:6px}
.vmini.big .vx,.vmini.big .vbig{top:66px}
.vdur{position:absolute;left:6px;bottom:6px;color:#fff;font-size:12px;font-weight:700;text-shadow:0 1px 3px #000}
.vload{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;background:rgba(0,0,0,.5);font-size:13px;text-align:center;padding:6px}
.vopen{position:absolute;right:10px;bottom:10px;border:0;border-radius:999px;background:rgba(10,18,30,.8);color:#fff;font:inherit;font-size:13px;font-weight:700;padding:6px 12px;cursor:pointer;z-index:2}
.dlg h3{font-size:14px;margin:4px 0 0;color:var(--muted);text-transform:none}
.ph.tap{cursor:pointer}
.ov{position:fixed;inset:0;z-index:20;background:rgba(10,18,30,.6);display:flex;align-items:flex-end;justify-content:center}
.ov[hidden]{display:none}
.dlg{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:0 0 18px}
.dlg .top{position:sticky;top:0;z-index:3;display:flex;justify-content:flex-end;padding:8px;pointer-events:none}
.dlg .top .x{pointer-events:auto;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.dlg .x{font:inherit;font-weight:700;border:0;background:#eef2f6;color:var(--ink);border-radius:999px;min-width:44px;min-height:44px;cursor:pointer}
.dlg .in{padding:14px 16px 0;display:grid;gap:10px}
.dlg h2{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:22px;line-height:1.15;margin:0;overflow-wrap:anywhere}
.dlg .txt{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5;margin:0}
.dlg .askbig{display:flex;align-items:center;justify-content:center;min-height:48px;border-radius:12px;background:var(--navy);color:#fff;font-weight:700;text-decoration:none}
@media (min-width:640px){.ov{align-items:center}.dlg{border-radius:18px}}
@media (min-width:640px){h1{font-size:34px}.grid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}}
</style>
</head>
<body>
<header><div class="in"><div class="brand"><img id="logo" alt="" hidden><div class="bt"><h1 id="nm">AH CHINA ORDERS</h1><div class="sub" id="sub">Products in stock</div></div></div><div class="acts" id="acts"></div></div></header>
<main>
  <div class="tools" id="tools" hidden><input type="search" id="q" placeholder="Search: name, size or code" aria-label="Search the products"><div class="chips" id="chips" role="group" aria-label="Groups"></div></div>
  <div class="count" id="count" aria-live="polite"></div>
  <div id="out"><div class="msg">Loading the products…</div></div>
  <p class="note" id="foot">Prices in Dalasi. Stock changes during the day: ask us before you come.</p>
  <a class="fbfoot" id="fbFoot" target="_blank" rel="noopener noreferrer" hidden><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M24 12a12 12 0 1 0-13.9 11.9v-8.4H7.1V12h3V9.4c0-3 1.8-4.7 4.5-4.7 1.3 0 2.7.2 2.7.2v3h-1.5c-1.5 0-2 .9-2 1.9V12h3.4l-.5 3.5h-2.9v8.4A12 12 0 0 0 24 12z"/></svg><span>Our Facebook page</span></a>
</main>
<div class="ov" id="ov" hidden><div class="dlg" id="dlg" role="dialog" aria-modal="true" aria-labelledby="dlgT"></div></div>
<script>
(function () {
  'use strict';
  var CFG = window.SHOP_CONFIG || {}, data = null, group = 'All';
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var D = function (n) { return 'D' + Math.round(Number(n) || 0).toLocaleString('en-US'); };
  var waNum = function (p) { var d = String(p || '').replace(/\D/g, ''); if (d.indexOf('00') === 0) d = d.slice(2); if (d.length === 7) d = '220' + d; return d; };
  function load() {
    $('out').innerHTML = '<div class="msg">Loading the products…</div>';
    fetch(CFG.api, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: 'catalogue', args: [] }), credentials: 'omit', cache: 'no-store' })
      .then(function (r) { return r.text(); })
      .then(function (t) { var o = JSON.parse(t); if (!o || !o.ok) throw new Error((o && o.error) || 'bad reply'); show(o.value); })
      .catch(function () { $('out').innerHTML = '<div class="msg">The products could not be loaded. Check the internet and try again.<br><button type="button" id="retry">Try again</button></div>'; $('retry').onclick = load; });
  }
  // products with options: the items of one product (fam) become one card; only the combinations the owner lists exist
  function mix(P, v) {
    var gp = Number(v.more) > 0 ? v : P.vs.filter(function (y) { return Number(y.more) > 0; })[0], vv = v.vid ? v : P.vs.filter(function (y) { return y.vid; })[0];
    var x = {}; for (var k in v) x[k] = v[k];
    x.P = P; x.name = P.name; x.vname = v.name; x.group = P.group; x.sizes = ''; x.desc = P.desc; x.od = v.od || '';
    x.photo = v.photo || P.famPhoto || '';
    x.pid = gp ? gp.pid : v.pid; x.more = gp ? Number(gp.more) || 0 : 0; x.hd = gp && gp.hd && x.photo === gp.photo ? 1 : 0;
    x.vid = vv ? vv.vid : null; x.vpid = vv ? vv.pid : v.pid; return x;
  }
  function fold(items) {
    var out = [], idx = {};
    items.forEach(function (x) {
      if (!x.fam || !x.ov || !x.on) { out.push(x); return; }
      var P = idx[x.fam]; if (!P) { P = idx[x.fam] = { isFam: true, fam: x.fam, name: x.fn || x.name, group: x.group, desc: x.desc || '', on: x.on, vs: [], sel: 0, code: x.code, price: 0 }; out.push(P); }
      P.vs.push(x);
    });
    out.forEach(function (P) {
      if (!P.isFam) return;
      P.vs.sort(function (a, b) { return (Number(a.price) || 0) - (Number(b.price) || 0) || String(a.code).localeCompare(String(b.code)); });
      var withPh = P.vs.filter(function (y) { return y.photo; })[0]; P.famPhoto = withPh ? withPh.photo : '';
      P.hay = P.name + ' ' + P.vs.map(function (y) { return y.name + ' ' + (y.od || ''); }).join(' ');
      P.cardX = mix(P, P.vs[0]); P.cardX.isFrom = P.vs.length > 1 && P.vs.some(function (y) { return y.price !== P.vs[0].price; });
      P.price = P.vs[0].price;
    });
    return out;
  }
  function pickOpt(P, k, val) {
    var cur = P.vs[P.sel].ov, best = -1, bi = P.sel;
    P.vs.forEach(function (v, i) { if (v.ov[k] !== val) return; if (!v.ov.every(function (o, j) { return j >= k || o === cur[j]; })) return; var m = 0; v.ov.forEach(function (o, j) { if (j !== k && o === cur[j]) m++; }); if (m > best) { best = m; bi = i; } });
    P.sel = bi;
  }
  function optBlock(P) {
    var cur = P.vs[P.sel];
    return P.on.map(function (nm, k) {
      var vals = P.vs.map(function (v) { return v.ov[k]; }).filter(function (v, i, a) { return a.indexOf(v) === i; });
      return '<div class="oh">' + esc(nm) + '</div><div class="oc">' + vals.map(function (v) {
        var fits = P.vs.some(function (y) { return y.ov[k] === v && y.ov.every(function (o, j) { return j >= k || o === cur.ov[j]; }); });
        return '<button type="button" data-ok="' + k + '" data-ov="' + esc(v) + '" aria-pressed="' + (cur.ov[k] === v) + '"' + (fits ? '' : ' class="alt" disabled title="Not available with your earlier choices"') + '>' + esc(v) + '</button>';
      }).join('') + '</div>';
    }).join('');
  }
  function show(v) {
    data = v || {};
    if (Array.isArray(data.items)) data.items = fold(prep(data.items));
    var name = data.business || CFG.name || 'Our shop';
    $('nm').textContent = name; document.title = name + ' · Products';
    // the shop's logo (the receipt logo), only a picture sent as data; otherwise no logo
    var lg = typeof data.logo === 'string' && /^data:image\/(png|jpe?g|webp|gif);base64,[A-Za-z0-9+\/=]+$/.test(data.logo) ? data.logo : '';
    $('logo').hidden = !lg; if (lg) { $('logo').src = lg; $('logo').alt = name + ' logo'; var fi = document.querySelector('link[rel=icon]'); if (fi) fi.href = lg; } else $('logo').removeAttribute('src');
    // a pre-order store: its standard footer explains the deposit (the owner's own footer still wins)
    if (ord() && !(typeof data.footer === 'string' && data.footer.trim())) $('foot').textContent = full() ? 'Prices in Dalasi. We order from China for you: pay the price to order' + (ord().arrive ? '; it arrives in about ' + ord().arrive : '') + '.' : 'Prices in Dalasi. We order from China for you: pay ' + pct() + ' to order and the rest when it arrives' + (ord().arrive ? ' (about ' + ord().arrive + ')' : '') + '.';
    if (typeof data.footer === 'string' && data.footer.trim()) $('foot').textContent = data.footer.trim().slice(0, 300);   // the owner's text; otherwise the standard sentence stays
    if (data.off) { $('tools').hidden = true; $('count').textContent = ''; $('out').innerHTML = '<div class="msg">This catalogue is closed right now.</div>'; return; }
    var when = data.at ? new Date(data.at).toLocaleString('en-GB', { timeZone: 'Africa/Banjul', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '';
    $('sub').textContent = [data.town, when ? 'updated ' + when : ''].filter(Boolean).join(' · ');
    var wa = waNum(data.phone), acts = '';
    if (wa) acts += '<a class="wa" href="https://wa.me/' + wa + '?text=' + encodeURIComponent('Hello ' + name + ', I saw your products.') + '" target="_blank" rel="noopener">WhatsApp us</a><a class="call" href="tel:+' + wa + '">Call ' + esc(data.phone) + '</a>';
    var fb = typeof data.fb === 'string' && data.fb.length <= 200 && /^https:\/\/((www|m|web)\.)?(facebook\.com|fb\.com|fb\.me)(\/[^\s"'<>]*)?$/i.test(data.fb) ? data.fb : '';
    if (fb && data.fbH !== false) acts += '<a class="fbi" href="' + esc(fb) + '" target="_blank" rel="noopener noreferrer" aria-label="Our Facebook page" title="Our Facebook page"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M24 12a12 12 0 1 0-13.9 11.9v-8.4H7.1V12h3V9.4c0-3 1.8-4.7 4.5-4.7 1.3 0 2.7.2 2.7.2v3h-1.5c-1.5 0-2 .9-2 1.9V12h3.4l-.5 3.5h-2.9v8.4A12 12 0 0 0 24 12z"/></svg></a>';
    $('acts').innerHTML = acts;
    $('fbFoot').hidden = !(fb && data.fbF !== false); if (fb) $('fbFoot').href = fb;
    var groups = ['All'].concat((data.items || []).map(function (x) { return x.group; }).filter(function (g, i, a) { return g && a.indexOf(g) === i; }));
    $('chips').innerHTML = groups.length > 2 ? groups.map(function (g) { return '<button type="button" data-g="' + esc(g) + '" aria-pressed="' + (g === group) + '">' + esc(g) + '</button>'; }).join('') : '';
    $('tools').hidden = !(data.items || []).length;
    render();
  }
  function render() {
    var q = $('q').value.trim().toLowerCase(), wa = waNum(data.phone), name = data.business || CFG.name || '';
    var list = (data.items || []).filter(function (x) {
      return (group === 'All' || x.group === group) && (!q || ((x.hay || x.name) + ' ' + x.code + ' ' + x.group + ' ' + x.sizes + ' ' + (x.desc || '')).toLowerCase().indexOf(q) >= 0);
    });
    $('count').textContent = (data.items || []).length ? list.length + ' product' + (list.length === 1 ? '' : 's') : '';
    if (!(data.items || []).length) { $('out').innerHTML = (ord() ? '<div class="msg">No products to order right now. Come back soon.</div>' : '<div class="msg">Nothing in stock to show right now. Come back soon.</div>'); return; }
    if (!list.length) { $('out').innerHTML = '<div class="msg">Nothing matches your search.</div>'; return; }
    shown = list;
    $('out').innerHTML = '<div class="grid">' + list.map(function (x, i) {
      var P = x; x = P.cardX || P;
      var ph = x.photo ? '<img src="' + esc(x.photo) + '" alt="' + esc(x.name) + '" loading="lazy">' : esc(x.code || '');
      var askLink = wa ? '<a class="ask" href="' + askUrl(x) + '" target="_blank" rel="noopener">Ask us</a>' : '';
      var n = (x.hd ? 0 : 1) + (Number(x.more) || 0) || 1;
      return '<article class="card"><div class="ph tap" data-i="' + i + '">' + ph + (x.photo && n > 1 ? '<span class="badge">' + n + ' photos</span>' : '') + (x.vid ? '<span class="badge vb">▶ video</span>' : '') + '</div><div class="body">' + (sea(x) ? '<span class="tag">' + SEA + '</span>' : '') + (x.pTag ? '<span class="tag promo">' + esc(x.pTag) + '</span>' : '') + '<div class="nm">' + esc(x.name) + '</div>' +
        '<div class="pr"><div class="p-price"><div class="k">' + (x.isFrom ? 'From' : 'Price') + '</div><div class="v">' + (x.was ? '<s class="was">' + D(x.was) + '</s>' : '') + D(x.price) + '</div></div></div>' + (P.cardX ? '<div class="opn">' + P.vs.length + ' option' + (P.vs.length === 1 ? '' : 's') + '</div>' : '') +
        (ord() && x.ws !== 'closed' ? (full(x) ? (whenOwn(x) ? '<div class="dep">Arrives in about ' + esc(whenOwn(x)) + '</div>' : '') : '<div class="dep">Deposit <b>' + D(depOf(x)) + '</b> (' + pct(x) + ')' + (whenOwn(x) ? '<br>Arrives in about ' + esc(whenOwn(x)) : '') + '</div>') : '') +
        winLine(x) + goalLine(x) +
        '<button type="button" class="more" data-i="' + i + '">Details</button>' +
        '<div class="foot"><span class="left">' + esc(leftText(x)) + '</span>' + askLink + '</div></div></article>';
    }).join('') + '</div>';
  }
  // pieces left as the owner chose: the number, "In stock", or "Only N left" when few (the server leaves hidden numbers out)
  // a pre-order store: the reply carries {deposit, arrive}; the deposit is rounded up to D25 like in the Shop Book
  // promotions and group-order windows follow today's date (Banjul = UTC), so they start and stop by themselves
  function dayNow() { return new Date().toISOString().slice(0, 10); }
  function okD(s) { return typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s); }
  function dm(s) { try { return new Date(s + 'T00:00:00Z').toLocaleDateString('en-GB', { day: 'numeric', month: 'short', timeZone: 'UTC' }); } catch (e) { return s; } }
  function daysTo(s) { return Math.round((Date.parse(s + 'T00:00:00Z') - Date.parse(dayNow() + 'T00:00:00Z')) / 864e5); }
  function prep(items) {
    var t = dayNow();
    items.forEach(function (x) {
      var pr = Number(x.pr) || 0, base = Number(x.price) || 0;
      if (pr > 0 && pr < base && okD(x.pt) && t <= x.pt && (!okD(x.pf) || t >= x.pf)) { x.was = base; x.price = Math.round(pr); x.pTag = (typeof x.pl === 'string' && x.pl.trim() ? x.pl.trim().slice(0, 30) : 'Promo') + ' · until ' + dm(x.pt); }
      if (ord() && (okD(x.of) || okD(x.ot))) x.ws = okD(x.of) && t < x.of ? 'soon' : okD(x.ot) && t > x.ot ? 'closed' : 'open';
    });
    return items;
  }
  function bulkBox(x) { return ord() && x.ws === 'open' && typeof x.ob === 'string' && x.ob.trim() ? '<div class="bulk">' + esc(x.ob.trim().slice(0, 140)) + '</div>' : ''; }
  function winLine(x) {
    if (!x.ws) return '';
    var lab = typeof x.ol === 'string' && x.ol.trim() ? esc(x.ol.trim().slice(0, 40)) + ': ' : '';
    if (x.ws === 'soon') return '<div class="win soon">' + lab + 'Orders open on ' + dm(x.of) + '</div>';
    if (x.ws === 'closed') return '<div class="win closed">' + lab + 'Closed · orders ended on ' + dm(x.ot) + '</div>';
    var d = okD(x.ot) ? daysTo(x.ot) : null;
    return '<div class="win' + (d != null && d <= 2 ? ' urgent' : '') + '">' + lab + (d == null ? 'Orders open' : 'Order by ' + dm(x.ot) + ' · ' + (d <= 0 ? 'last day' : d === 1 ? '1 day left' : d + ' days left')) + '</div>';
  }
  function goalLine(x) {
    if (!ord()) return '';
    var mq = Number(x.mq) || 0, mb = Number(x.mb) || 0, mbl = mb > 1 ? '<div class="goal mb">Minimum order: ' + mb + ' pieces</div>' : '';
    if (mq > 0) { var c0 = Math.max(0, Number(x.oc) || 0), p0 = Math.min(100, Math.round(c0 / mq * 100));
      return '<div class="goal"><div class="gb"><i style="width:' + p0 + '%"></i></div>' + (c0 >= mq ? 'Supplier minimum reached: ' + c0 + ' ordered' : 'We need ' + mq + ' pieces in total to order: ' + c0 + ' so far') + '</div>' + mbl; }
    var m = Number(x.om) || 0; if (!(m > 0)) return mbl;
    var c = Math.max(0, Number(x.oc) || 0), p = Math.min(100, Math.round(c / m * 100));
    return '<div class="goal"><div class="gb"><i style="width:' + p + '%"></i></div>' + (c >= m ? 'Target reached: ' + c + ' ordered' : c + ' of ' + m + ' ordered') + '</div>' + mbl;
  }
  function ord() { var o = data && data.order; return o && Number(o.deposit) > 0 && Number(o.deposit) <= 1 ? o : null; }
  // a product may have its own deposit (dep) and arrival time (when), and the label "Made to order · by sea" (sea)
  var SEA = 'Made to order · by sea';
  function depPct(x) { var d = Number(x && x.dep); return d >= 0.1 && d <= 1 ? d : Number(ord().deposit); }
  function pct(x) { return Math.round(depPct(x) * 100) + '%'; }
  function depOf(x) { var p = Number(x.price) || 0; return Math.min(p, Math.ceil(p * depPct(x) / 25 - 1e-9) * 25); }
  function full(x) { return depPct(x) >= 0.999; }   // 100% = full payment: only the price is shown
  function whenOwn(x) { return ord() && typeof x.when === 'string' ? x.when.trim().slice(0, 40) : ''; }
  function whenOf(x) { return whenOwn(x) || ord().arrive || ''; }
  function sea(x) { return !!(ord() && x.sea === true); }
  function leftText(x) {
    if (x.ws === 'closed') return 'Closed';
    if (x.ws === 'soon') return 'Opens ' + dm(x.of);
    if (ord()) return 'Order now';
    var n = Number(x.left);
    if (x.left == null || !(n > 0)) return 'In stock';
    return data.leftMode === 'few' ? 'Only ' + n + ' left' : n + ' left';
  }
  function askUrl(x) {
    var name = data.business || CFG.name || '';
    return 'https://wa.me/' + waNum(data.phone) + '?text=' + encodeURIComponent((x.ws === 'closed' || x.ws === 'soon') ? 'Hello ' + name + ', I would like to know when I can order ' + (x.vname || x.name) + (x.code ? ' (' + x.code + ')' : '') + '.' : ord() ? 'Hello ' + name + ', I would like to order ' + (x.vname || x.name) + (x.code ? ' (' + x.code + ')' : '') + ', price ' + D(x.price) + '.' : 'Hello ' + name + ', I am interested in ' + (x.vname || x.name) + (x.code ? ' (' + x.code + ')' : '') + '.');
  }
  // the details of one product, over the list; the phone's Back button closes it
  var opened = false, lastFocus = null, extra = {}, showing = null;
  var okPhoto = function (p) { return typeof p === 'string' && /^data:image\/(jpeg|png|webp|gif);base64,[A-Za-z0-9+\/=]+$/.test(p); };
  function openDetails(x) {
    var P0 = x.isFam ? x : null, sc = [$('ov').scrollTop, $('dlg').scrollTop]; if (P0) x = mix(P0, P0.vs[P0.sel]);
    var wa = waNum(data.phone), more = Number(x.more) || 0; showing = x;
    $('dlg').innerHTML = '<div class="top"><button type="button" class="x" id="dlgX" aria-label="Close">✕</button></div>' +
      (x.photo || more || x.vid ? '<div class="gal" id="gal"><div class="track" id="track"></div><button type="button" class="gnav prev" id="gPrev" aria-label="Previous photo">‹</button><button type="button" class="gnav next" id="gNext" aria-label="Next photo">›</button><span class="gcount" id="gCount" hidden></span></div>' : '') +
      '<div class="in">' + (sea(x) ? '<span class="tag">' + SEA + '</span>' : '') + (x.pTag ? '<span class="tag promo">' + esc(x.pTag) + '</span>' : '') + '<h2 id="dlgT">' + esc(x.name) + '</h2>' +
      (x.code ? '<div class="sz">' + esc(x.code) + '</div>' : '') +
      (P0 ? '<div class="opts">' + optBlock(P0) + '</div>' : '') +
      '<div class="pr"><div class="p-price"><div class="k">Price</div><div class="v">' + (x.was ? '<s class="was">' + D(x.was) + '</s>' : '') + D(x.price) + '</div></div></div>' + winLine(x) + goalLine(x) + bulkBox(x) +
      (ord() && x.ws !== 'closed' ? '<div class="howto"><b>How ordering works</b><br>' + (sea(x) ? 'This product is made to order and comes by sea. ' : '') + (full(x) ? 'Pay the full price (' + D(x.price) + ') to order. We order it from China for you' + (whenOf(x) ? '; it arrives in about ' + esc(whenOf(x)) : '') + '.' : 'Pay a deposit of ' + D(depOf(x)) + ' (' + pct(x) + ') to order. We order it from China for you' + (whenOf(x) ? '; it arrives in about ' + esc(whenOf(x)) : '') + '. Pay the rest (' + D(Number(x.price) - depOf(x)) + ') when it arrives.') + '</div>' : '<div class="left">' + esc(leftText(x)) + '</div>') +
      (x.sizes ? '<h3>Sizes / colours</h3><p class="txt">' + esc(x.sizes) + '</p>' : '') +
      (x.od ? '<h3>This option</h3><p class="txt">' + esc(x.od) + '</p>' : '') +
      (x.desc ? '<h3>Details</h3><p class="txt">' + esc(x.desc) + '</p>' : '') +
      (wa ? '<a class="askbig" href="' + askUrl(x) + '" target="_blank" rel="noopener">' + (x.ws === 'closed' ? 'Closed: ask about the next round' : x.ws === 'soon' ? 'Not open yet: ask about this' : ord() ? 'Order this on WhatsApp' : 'Ask about this on WhatsApp') + '</a>' : '') + '</div>';
    drawGallery(x); if (x.vid) drawVideo(x, !(x.photo || more));
    if (more && !extra[x.pid]) {
      fetch(CFG.api, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: 'catalogPhotos', args: [x.pid] }), credentials: 'omit', cache: 'no-store' })
        .then(function (r) { return r.text(); }).then(function (t) { var o = JSON.parse(t); if (!o || !o.ok) throw new Error('bad reply'); extra[x.pid] = (o.value || []).filter(okPhoto); })
        .catch(function () { extra[x.pid] = null; })
        .then(function () { if (showing === x) drawGallery(x); if (extra[x.pid] === null) delete extra[x.pid]; });
    }
    if ($('ov').hidden) lastFocus = document.activeElement; $('ov').hidden = false; document.body.style.overflow = 'hidden'; if (P0) { $('ov').scrollTop = sc[0]; $('dlg').scrollTop = sc[1]; } else $('dlgX').focus();
    if (!opened) { opened = true; try { history.pushState({ details: 1 }, ''); } catch (e) {} }
  }
  // the video: a small window over the photos (like the shopping apps); nothing is loaded until ▶ is tapped
  var vids = {};
  var mmss = function (s) { s = Math.round(Number(s) || 0); return Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2); };
  function drawVideo(x, big) {
    var g = $('gal'); if (!g) return; var old = $('vmini'); if (old) old.remove(); var op = $('vOpen'); if (op) op.remove();
    var v = x.vid, box = document.createElement('div'); box.className = 'vmini' + (big ? ' big' : ''); box.id = 'vmini';
    box.innerHTML = (v.poster && /^data:image\/jpeg;base64,/.test(v.poster) ? '<img src="' + esc(v.poster) + '" alt="">' : '<div style="height:160px"></div>') +
      '<button type="button" class="vplay" id="vPlay" aria-label="Play the video">▶</button><span class="vdur">' + esc(mmss(v.secs)) + ' · ' + esc(((Number(v.size) || 0) / 1048576).toFixed(1)) + ' MB</span>' +
      '<button type="button" class="vx" id="vX" aria-label="Close the video">✕</button>';
    if (big) g.style.minHeight = 'min(60vh,420px)';
    g.appendChild(box);
    box._close = function () { box.remove(); var b = document.createElement('button'); b.type = 'button'; b.className = 'vopen'; b.id = 'vOpen'; b.textContent = '▶ Video'; b.onclick = function () { drawVideo(x, big); }; g.appendChild(b); };
    $('vX').onclick = box._close;
    $('vPlay').onclick = function () { playVideo(x, box); };
    if (vids[x.vpid || x.pid] && vids[x.vpid || x.pid].url) playVideo(x, box);
  }
  function part(pid, i) {
    return fetch(CFG.api, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: 'catalogVideo', args: [pid, i] }), credentials: 'omit', cache: 'no-store' })
      .then(function (r) { return r.text(); }).then(function (t) { var o = JSON.parse(t); if (!o || !o.ok || !o.value || !/^[A-Za-z0-9+\/=]+$/.test(o.value.b64 || '')) throw new Error('bad'); return o.value; });
  }
  var bytes = function (b64) { var s = atob(b64), a = new Uint8Array(s.length); for (var i = 0; i < s.length; i++) a[i] = s.charCodeAt(i); return a; };
  function playVideo(x, box) {
    var c = vids[x.vpid || x.pid] || (vids[x.vpid || x.pid] = {});
    var show = function () {
      if (!box.isConnected) return;
      box.innerHTML = '<video src="' + c.url + '" playsinline autoplay></video><button type="button" class="vbig" id="vBig" aria-label="Bigger or smaller">⤢</button><button type="button" class="vx" id="vX" aria-label="Close the video">✕</button>';
      var vd = box.querySelector('video'); vd.onerror = function () { box.insertAdjacentHTML('beforeend', '<div class="vload">This video cannot play on this phone.</div>'); };
      var p = vd.play(); if (p && p.catch) p.catch(function () {});
      // small: tap the video to make it big; big: the player's own buttons (pause, sound, full screen)
      var size = function () { box.classList.toggle('big'); vd.controls = box.classList.contains('big'); };
      vd.controls = box.classList.contains('big');
      vd.onclick = function () { if (!vd.controls) size(); };
      $('vBig').onclick = size;
      $('vX').onclick = function () { vd.pause(); box._close(); };
    };
    if (c.url) return show();
    if (c.busy) return; c.busy = true;
    var load = document.createElement('div'); load.className = 'vload'; load.textContent = 'Loading the video…'; box.appendChild(load);
    var got = [], done = 0, n = 0, type = 'video/mp4';
    part(x.vpid || x.pid, 0).then(function (p0) {
      n = Math.max(1, Math.min(24, Number(p0.n) || 1)); type = /^video\/(mp4|webm)$/.test(p0.type) ? p0.type : 'video/mp4'; got[0] = bytes(p0.b64); done = 1;
      load.textContent = 'Loading the video… ' + Math.round(100 * done / n) + '%';
      var next = 1;
      var worker = function () { if (next >= n) return Promise.resolve(); var i = next++; return part(x.vpid || x.pid, i).then(function (p) { got[i] = bytes(p.b64); done++; load.textContent = 'Loading the video… ' + Math.round(100 * done / n) + '%'; return worker(); }); };
      return Promise.all([worker(), worker(), worker()]);
    }).then(function () {
      c.url = URL.createObjectURL(new Blob(got, { type: type })); c.busy = false; show();
    }).catch(function () {
      c.busy = false; load.innerHTML = 'The video could not be loaded. Check the internet.<br><button type="button" class="vplay" style="position:static;margin-top:6px;width:auto;height:auto;padding:6px 12px;font-size:13px">Try again</button>';
      load.querySelector('button').onclick = function (e) { e.stopPropagation(); load.remove(); playVideo(x, box); };
    });
  }
  // the photos of one product: the main one, then the catalogue photos (swipe, or the arrows on a computer)
  function drawGallery(x) {
    var tr = $('track'); if (!tr) return;
    var more = Number(x.more) || 0, got = extra[x.pid], list = (x.photo && !(x.hd && got && got.length) ? [x.photo] : []).concat(got || []);   // the main photo first, then the catalogue photos (when the first catalogue photo is the large copy of the main one, the small one is left out)
    var slides = list.map(function (src, k) { return '<div class="slide"><img src="' + esc(src) + '" alt="' + esc(x.name) + ' photo ' + (k + 1) + '"></div>'; });
    if (more && got === undefined) slides.push('<div class="slide wait">Loading more photos…</div>');
    if (more && got === null) slides.push('<div class="slide wait">More photos could not be loaded. Check the internet.</div>');
    tr.innerHTML = slides.join('');
    var n = tr.children.length, c = $('gCount');
    $('gal').classList.toggle('multi', n > 1); c.hidden = n < 2;
    var at = function () { return Math.round(tr.scrollLeft / Math.max(1, tr.clientWidth)); };
    var upd = function () { c.textContent = Math.min(n, at() + 1) + ' / ' + n; };
    tr.onscroll = upd; upd();
    $('gPrev').onclick = function () { tr.scrollTo({ left: Math.max(0, at() - 1) * tr.clientWidth, behavior: 'smooth' }); };
    $('gNext').onclick = function () { tr.scrollTo({ left: Math.min(n - 1, at() + 1) * tr.clientWidth, behavior: 'smooth' }); };
  }
  function closeDetails(fromBack) {
    if ($('ov').hidden) return;
    $('ov').hidden = true; $('dlg').innerHTML = ''; document.body.style.overflow = ''; showing = null;
    if (opened) { opened = false; if (!fromBack) { try { history.back(); } catch (e) {} } }
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }
  var shown = [];
  $('out').addEventListener('click', function (e) { var b = e.target.closest('[data-i]'); if (b && shown[+b.getAttribute('data-i')]) openDetails(shown[+b.getAttribute('data-i')]); });
  $('dlg').addEventListener('click', function (e) { var b = e.target.closest('[data-ok]'); if (!b || b.disabled || !showing || !showing.P) return; pickOpt(showing.P, +b.getAttribute('data-ok'), b.getAttribute('data-ov')); openDetails(showing.P); });
  $('ov').addEventListener('click', function (e) { if (e.target === $('ov') || e.target.closest('#dlgX')) closeDetails(false); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeDetails(false); });
  window.addEventListener('popstate', function () { closeDetails(true); });
  $('q').addEventListener('input', function () { if (data) render(); });
  $('chips').addEventListener('click', function (e) { var b = e.target.closest('[data-g]'); if (!b) return; group = b.getAttribute('data-g'); Array.prototype.forEach.call($('chips').children, function (c) { c.setAttribute('aria-pressed', c === b); }); render(); });
  if (!CFG.api) { $('out').innerHTML = '<div class="msg">This page is missing the store link.</div>'; return; }
  load();
})();
</script>
