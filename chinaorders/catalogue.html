#multiBody{padding:0 16px 4px}.mhint{margin:8px 0 2px;font-size:13px;color:var(--muted)}
.mrow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.mrow.na{opacity:.55}.mrow.bad .mname span.mmin{color:#b02a1d;font-weight:700}
.mname{min-width:0;display:grid;gap:2px;overflow-wrap:anywhere}.mname span{font-size:13px;color:var(--muted)}
.mstep{display:flex;align-items:center;gap:4px;flex:none}
.mstep button{width:40px;height:40px;padding:0;border:1px solid #75869d;border-radius:10px;background:#fff;color:#203a60;font:inherit;font-size:20px;cursor:pointer}
.mstep button:disabled{opacity:.4;cursor:default}
.mstep input{width:56px;min-height:40px;text-align:center;font:inherit;font-size:16px;border:1px solid var(--line);border-radius:8px}
.mfoot{position:sticky;bottom:0;background:var(--card);padding:10px 16px max(12px,env(safe-area-inset-bottom));border-top:1px solid var(--line);display:grid;gap:6px}
.mfoot p{margin:0}.mfoot .mnote{font-size:13px;color:#b02a1d}
.mfoot .askbig,#reviewBody .askbig.sec{display:grid;place-items:center;width:100%;min-height:48px;border:0;border-radius:10px;background:var(--navy);color:#fff;font:inherit;font-weight:700}
.mfoot .askbig:disabled{opacity:.55;cursor:default}
#reviewBody .askbig.sec{background:#fff;color:var(--navy);border:1.5px solid var(--navy)}
.review-line .rm{margin-left:auto}
#reviewBody .askbig:disabled,.purchase-actions .askbig:disabled{opacity:.55;cursor:default}
.purchase-actions button.askbig{border:0;font:inherit;font-weight:700;padding:8px 12px}
.browse-controls :is(button,select):focus-visible,.review-line button:focus-visible{outline:3px solid #407cbe;outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
</style>
</head>
