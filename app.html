<script>
(() => {
'use strict';
/* ---------- helpers ---------- */
const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const num = v => { const n = parseFloat(String(v ?? '').replace(/,/g,'')); return isFinite(n) ? n : 0; };
const sum = (a, f) => a.reduce((t, x) => t + (f(x) || 0), 0);
const D = n => (n == null || !isFinite(n)) ? '–' : (n < 0 ? '−D' : 'D') + Math.round(Math.abs(n)).toLocaleString('en-US');
const P = n => Math.round((n || 0) * 100) + '%';
const ceilTo = (x, step) => step > 0 ? Math.ceil(x / step - 1e-9) * step : x;
const pad = n => String(n).padStart(2, '0');
const ymd = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
// the shop's calendar day (Gambia time), whatever the phone's own time zone is, e.g. the owner in China
const today = () => { try { const d = new Date().toLocaleDateString('en-CA', { timeZone: 'Africa/Banjul' }); if (/^\d{4}-\d{2}-\d{2}$/.test(d)) return d; } catch {} return ymd(new Date()); };
const parseD = s => { if (!s) return null; const [y,m,d] = s.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (s, n) => { const d = parseD(s); if (!d) return null; d.setDate(d.getDate() + n); return ymd(d); };
const daysUntil = s => { const d = parseD(s); if (!d) return null; const t = parseD(today()); return Math.round((d - t) / 86400000); };
const nice = s => { const d = parseD(s); return d ? d.toLocaleDateString('en-GB', {day:'numeric', month:'short', year:'numeric'}) : '–'; };
const short = s => { const d = parseD(s); return d ? d.toLocaleDateString('en-GB', {day:'numeric', month:'short'}) : '–'; };
const store = {get(k){try{return localStorage.getItem(k)}catch{return null}}, set(k,v){try{localStorage.setItem(k,v)}catch{}}};

const PAYMENTS = ['Cash', 'Wave', 'QMoney', 'APS Wallet', 'Other mobile money', 'Bank', 'Credit'];
const CHANNELS = ['WhatsApp', 'Facebook', 'Shop', 'Friend/family'];
/* shop identity: the build sets APP; the owner's settings (name, town, seller) win when filled in */
const APP = { book: 'Shop Book', biz: 'My Shop', town: '', seller: 'the seller' }; // EDIT these 4 values for each new shop (see REBUILD_INSTRUCTIONS.md)
const BIZ = () => ST().business || APP.biz;
const TOWN = () => (ST().town != null ? ST().town : APP.town) || '';
const SELLER = () => ST().seller || APP.seller || 'the seller';
const PLACE = () => TOWN() || 'the shop';
const EXP_CATS_F = () => ['Shop rent', 'Transport / delivery', 'Phone & data', 'Shop setup', SELLER() + "'s pay", 'Packaging', 'Other'];
const DEFAULT_SETTINGS = {business:'',  markups:{'General':0.45,'Shop equipment':0}, bargain:0.15, floor:0.25, step:50, floorStep:25,
  nextOrder:{festival:'', festivalDate:'', daysBefore:21, leadDays:70, bufferDays:10, note:''}};

/* ---------- state ---------- */
const S = { db:null, user:null, uid:null, canWrite:true, noDb:false, settings:null, ships:[], items:[], sales:[], expenses:[],
  got:{settings:false, ships:false, items:false, sales:false, expenses:false}, names:{},
  tab: store.get('tab') || 'home', shipId: store.get('ship') || '', stockGroup:'All', stockQ:'', sellQ:'', custQ:'', customers:[], isOwner:false, adjustments:[], cashups:[], counts:[], log:[], meta:{}, cashDate:'', insights:false, priceCard:false, basket:null, basketForm:null, selMode:false, sel:new Set() };
const ST = () => Object.assign({}, DEFAULT_SETTINGS, S.settings || {});

/* ---------- calculations (same method as the Excel workbook) ---------- */
function calcShip(ship) {
  return calcCore(ship, S.items.filter(i => i.ship === ship.id), S.sales.filter(s => s.ship === ship.id), S.expenses.filter(e => e.ship === ship.id), (S.adjustments || []).filter(a => a.ship === ship.id));
}
function calcCore(ship, items, sales, shipExp, adjs, mkOver) {
  const st = ST(); const MK = mkOver || st.markups || {};
  const ex = ship.exchanges || [];
  const exG = sum(ex, e => num(e.gmd)), exR = sum(ex, e => num(e.rate) > 0 ? num(e.gmd) / num(e.rate) : 0);
  const rate = exR > 0 ? exG / exR : num(ship.planRate);
  const goodsRMB = sum(items, i => num(i.qty) * num(i.rmb));
  const goodsGMD = goodsRMB * rate;
  const importCosts = sum(ship.costs || [], c => num(c.gmd));
  const sc = ship.selling || {};
  const allowance = num(sc.online) + num(sc.rent) * num(sc.months) + num(sc.setup);
  const base = goodsGMD + importCosts + allowance;               // pricing base
  const mult = goodsRMB > 0 ? base / goodsRMB : 0;                // GMD per RMB, every item
  const nfs = items.filter(i => i.forSale === false);
  const nfsRMB = sum(nfs, i => num(i.qty) * num(i.rmb));
  const recover = ship.recoverPct == null ? 1 : num(ship.recoverPct);
  const unrec = nfsRMB * mult * (1 - recover);                    // equipment cost left for later shipments
  const saleRMB = goodsRMB - nfsRMB;
  const saleMult = saleRMB > 0 ? (base - unrec) / saleRMB : 0;     // GMD per RMB for items for sale
  const spent = goodsGMD + importCosts;                           // money really spent (no selling allowance)
  const costMult = saleRMB > 0 ? (spent - (goodsRMB > 0 ? nfsRMB * (spent / goodsRMB) * (1 - recover) : 0)) / saleRMB : 0; // cost of goods per RMB, equipment included
  const ownMult = goodsRMB > 0 ? spent / goodsRMB : 0;            // cost of goods per RMB, equipment left out
  const soldBy = {}, revBy = {};
  sales.forEach(s => { soldBy[s.itemId] = (soldBy[s.itemId] || 0) + num(s.qty); revBy[s.itemId] = (revBy[s.itemId] || 0) + num(s.total); });

/* Credit */
function debtKey(s) { return s.customerId ? 'id:' + s.customerId : 'nm:' + (s.customer || 'No name') + '|' + (s.phone || ''); }
function debtName(k, list) { const c = k.startsWith('id:') ? S.customers.find(x => x.id === k.slice(3)) : null; const s = list[0] || {};
  return { name: c ? c.name : (s.customer || 'No name'), phone: c ? (c.phone || s.phone || '') : (s.phone || ''), code: c ? c.code : '' }; }
function vCredit() {
  const all = S.sales.filter(s => num(s.total) - num(s.paid) > 0.5);
  const byCust = {};
  all.forEach(s => { const k = debtKey(s); (byCust[k] = byCust[k] || []).push(s); });
  const keys = Object.keys(byCust).sort((a, b) => sum(byCust[b], s => num(s.total) - num(s.paid)) - sum(byCust[a], s => num(s.total) - num(s.paid)));
  const total = sum(all, s => num(s.total) - num(s.paid));
  const itemName = s => (S.items.find(i => i.id === s.itemId) || {}).name || s.name || '';
  const q = String(S.custQ || '').trim().toLowerCase();
  const custs = S.customers.map(c => { const ss = custSales(c); return { c, n: new Set(ss.map(s => s.invoiceNo || s.id)).size, spent: sum(ss, s => num(s.total)), owes: sum(ss, s => num(s.total) - num(s.paid)), last: ss.reduce((m, s) => s.date > m ? s.date : m, '') }; })
    .filter(x => !q || (x.c.name + ' ' + (x.c.phone || '') + ' ' + x.c.code).toLowerCase().includes(q))
    .sort((a, b) => String(b.last).localeCompare(String(a.last)) || a.c.name.localeCompare(b.c.name));
  return `<section class="screen">
  <div class="panel"><div class="spread"><div><div class="label">Owed by customers (all shipments)</div><div class="big">${D(total)}</div></div><span class="pill ${total > 0 ? 'warn' : 'ok'}">${keys.length} customer${keys.length === 1 ? '' : 's'}</span></div>
  <p class="note">Credit only to people you know well. When a customer pays, tap "Record payment".</p></div>
  ${keys.map(k => { const list = byCust[k]; const who = debtName(k, list); const owe = sum(list, s => num(s.total) - num(s.paid));
    return `<div class="panel"><div class="spread"><div><h3>${esc(who.name)}</h3><div class="small muted">${[who.code, who.phone || 'No phone recorded'].filter(Boolean).map(esc).join(' · ')}</div></div><b style="font-size:20px;color:var(--warn)">${D(owe)}</b></div>
    <div class="list" style="margin-top:8px">${list.map(s => `<div class="li" style="grid-template-columns:1fr auto"><div><div class="t">${esc(s.qty)} × ${esc(itemName(s))}</div><div class="small muted">${nice(s.date)} · total ${D(s.total)} · paid ${D(s.paid)} · ${(() => { const d = daysUntil(s.date); return d == null ? '' : d >= 0 ? (d === 0 ? 'today' : 'dated ahead') : (-d === 1 ? '1 day ago' : -d + ' days ago'); })()}</div></div>
      <span></span></div>`).join('')}</div>
    ${S.canWrite ? `<div class="fgrid" style="margin-top:8px"><button type="button" class="btn primary" data-act="payCust" data-id="${esc(k)}">Record payment</button><button type="button" class="btn" data-act="remind" data-id="${esc(k)}">Remind on WhatsApp</button></div>` : ''}
    ${(() => { const lr = lastReminder(k); return lr ? `<p class="small muted" style="margin:6px 0 0">Last reminded ${nice(lr.slice(0, 10))}</p>` : ''; })()}</div>`; }).join('') || '<div class="panel empty">Nobody owes money right now.</div>'}
  <div class="panel"><div class="spread"><h2>Customers</h2><span class="muted small">${S.customers.length} saved</span></div>
    <input id="custQ" type="search" placeholder="Search name, phone or ID" value="${esc(S.custQ || '')}" style="margin:12px 0" aria-label="Search customers">
    <div class="list">${custs.slice(0, 40).map(x => `<button type="button" class="li" data-act="cust" data-id="${esc(x.c.id)}" style="grid-template-columns:1fr auto;background:none;border:0;border-bottom:1px solid var(--line);text-align:left;cursor:pointer;width:100%;color:inherit">
      <div style="min-width:0"><div class="t">${esc(x.c.name)}</div><div class="small muted">${esc(x.c.code)}${x.c.phone ? ' · ' + esc(x.c.phone) : ''} · ${x.n} purchase${x.n === 1 ? '' : 's'}${x.last ? ' · last ' + short(x.last) : ''}</div></div>
      <div style="text-align:right"><b>${D(x.spent)}</b>${x.owes > 0.5 ? `<br><span class="pill warn">Owes ${D(x.owes)}</span>` : ''}</div></button>`).join('') || '<div class="empty">No customers yet. A customer is saved when you write a name or phone on a sale.</div>'}</div>
  </div>
  </section>`;
}

  const genTotal = sum(general, e => num(e.amount));
  const totIn = sum(calcs, c => c.cash), totOut = sum(calcs, c => c.shipmentCost + c.expenses) + genTotal;
  const exps = S.expenses.slice().sort((a, b) => String(b.date).localeCompare(String(a.date))).slice(0, 60);

  return `<section class="screen">
  ${dayPanel()}
  ${profitPanel()}
  <div class="grid-tiles">
    <div class="tile"><div class="label">Cash in (all shipments)</div><div class="v">${D(totIn)}</div><div class="s">money collected from sales</div></div>
    <div class="tile"><div class="label">Money out</div><div class="v">${D(totOut)}</div><div class="s">shipments + expenses</div></div>
    <div class="tile"><div class="label">Difference</div><div class="v" style="color:${totIn - totOut >= 0 ? 'var(--target)' : 'var(--low)'}">${D(totIn - totOut)}</div><div class="s">plus unsold stock and money owed</div></div>

    <p class="note">"Profit so far" is cash in minus everything this shipment cost (goods, transport, commission, shipping and its expenses). It turns positive once all the money is back.${calcs.some(c => c.unrec > 1) ? ' Shop equipment carried to later shipments is left out.' : ''}</p></div>
  <div class="panel"><div class="spread"><h2>Expenses</h2>${S.canWrite ? '<button type="button" class="btn primary" data-act="newExp">Add expense</button>' : ''}</div>
    <p class="note">Record real running costs here: rent, delivery, data, ${esc(SELLER())}'s pay. Link each one to a shipment, or to the whole business.</p>
    ${exps.length ? `<div class="list">${exps.map(e => `<div class="li" style="grid-template-columns:1fr auto"><div><div class="t">${esc(e.category)}${e.note ? ' — <span style="font-weight:400">' + esc(e.note) + '</span>' : ''}</div><div class="small muted">${nice(e.date)} · ${esc(shipName(e.ship))}</div></div><div style="text-align:right"><b>${D(e.amount)}</b>${S.canWrite ? `<br><button type="button" class="btn ghost" style="min-height:32px;padding:3px 8px;font-size:13px" data-act="editExp" data-id="${esc(e.id)}">Edit</button>` : ''}</div></div>`).join('')}</div>` : '<div class="empty">No expenses recorded yet.</div>'}
  </div>
  <div class="panel"><h2>Download records</h2><p class="note">Save the sales or the stock list as a CSV file to open in Excel.</p>
    <div class="row"><button type="button" class="btn" data-act="csvSales">Sales (CSV)</button><button type="button" class="btn" data-act="csvStock">Stock & prices (CSV)</button><button type="button" class="btn" data-act="csvExp">Expenses (CSV)</button></div></div>
  </section>`;
}

/* ---------- sheets (forms) ---------- */
function openSheet(title, body, onMount) {
  const root = $('#sheetRoot');
  root.innerHTML = `<div class="sheet-back" data-close="1"><div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="sheet-head"><h2>${esc(title)}</h2><button type="button" class="x" data-close="1" aria-label="Close">×</button></div>${body}</div></div>`;
  const sh = $('.sheet', root);
  root.onclick = e => { if (e.target.dataset && e.target.dataset.close) closeSheet(); };
  if (onMount) onMount(sh);
  const f = $('input,select,textarea', sh); if (f && window.innerWidth > 760) f.focus();
}
function closeSheet() { $('#sheetRoot').innerHTML = ''; }
function toast(msg) { const t = $('#toastRoot'); t.innerHTML = `<div class="toast" role="status">${esc(msg)}</div>`; clearTimeout(toast.h); toast.h = setTimeout(() => t.innerHTML = '', 2600); }
function errMsg(e) {
  const code = e && e.code;
  if (code === 'quota_exceeded') return 'Storage is full. Download old records and delete some before adding more.';
  if (code === 'invalid_argument') return S.isOwner ? 'This could not be saved (not allowed).' : 'Only the owner can change prices, items and shipments. If this was a sale, ask the owner for Editor access.';
  if (code === 'unavailable') return 'No connection right now. Check the internet and try again.';
  return 'Could not save: ' + ((e && e.message) || 'unknown problem');
}
async function write(fn, okMsg) {
  try { await fn(); if (okMsg) toast(okMsg); return true; }
  catch (e) { if (e && e.code === 'unavailable') { await new Promise(r => setTimeout(r, 800 + Math.random() * 700)); try { await fn(); if (okMsg) toast(okMsg); return true; } catch (e2) { toast(errMsg(e2)); return false; } } toast(errMsg(e)); return false; }
}

/* Sale form */
function saleSheet(itemId, saleId) {
  const ship = curShip(); const c = calcShip(ship);
  const ex = saleId ? S.sales.find(s => s.id === saleId) : null;
  const r = c.items.find(i => i.id === (ex ? ex.itemId : itemId)) || (ex ? itemRow(ex.itemId) : null);
  if (!r) { toast('That item is not in this shipment.'); return; }
  const v = ex ? {...ex} : {qty: 1, price: r.used, channel: 'WhatsApp', date: today(), customer: '', phone: '', size: '', note: ''};
  const ps = ex ? payStateFrom(ex) : { mode: 'Cash', paid: 0, paidBy: 'Cash' };
  const keepHistory = ex && ex.payment === 'Credit' && (ex.payments || []).length > 1;
  const disc0 = ex ? Math.max(0, Math.round(num(ex.qty) * num(ex.price) - num(ex.total))) : 0;
  const cu = ex ? custOf(ex) : null;
  const retQty = ex ? sum(ex.returns || [], x => num(x.qty)) : 0;
  const body = `<div class="row" style="flex-wrap:nowrap">${img(r, 'thumb lg')}<div style="min-width:0"><div class="t" style="font-weight:700">${esc(r.name)}</div><div class="small muted">${esc(r.code)} · ${r.left + (ex ? num(ex.qty) : 0)} in stock${r.sizes ? ' · ' + esc(r.sizes) : ''}</div></div></div>
    ${priceTrio(r)}
    ${ex ? `<p class="small muted" style="margin:0">Receipt ${esc(ex.invoiceNo || '–')}${cu ? ' · customer ' + esc(cu.code) : ''} ${OWN() ? ` · profit on this sale <b>${D(num(ex.total) - num(ex.qty) * num(r.landed))}</b> (landed cost ${D(r.landed)} a piece)` : ''}${retQty ? ` · ${retQty} piece${retQty === 1 ? '' : 's'} returned` : ''}</p>` : ''}
    <form id="saleF" class="list" style="gap:12px">
      <div class="fgrid"><label class="f">Pieces<div class="stepper"><button type="button" data-step="-1" aria-label="One less">−</button><input id="sQty" inputmode="numeric" value="${esc(v.qty)}"><button type="button" data-step="1" aria-label="One more">+</button></div></label>
      <label class="f">Price per piece (D)<input id="sPrice" inputmode="decimal" value="${esc(v.price)}"></label></div>
      <label class="f">Discount on this sale (D) <span class="h">optional, shown on the receipt</span><input id="sDisc" inputmode="decimal" value="${disc0 || ''}" placeholder="0"></label>

function payResult(st, total, date) {

/* ---------- deleting a shipment or several items with everything linked ---------- */
function purgePlan(shipId, itemIds) {
  const ids = new Set(shipId ? S.items.filter(i => i.ship === shipId).map(i => i.id) : itemIds);
  const items = S.items.filter(i => ids.has(i.id));
  const sales = S.sales.filter(s => ids.has(s.itemId) || (shipId && s.ship === shipId));
  const adjs = S.adjustments.filter(a => ids.has(a.itemId) || (shipId && a.ship === shipId));
  const counts = shipId ? S.counts.filter(x => x.ship === shipId) : [];
  const exps = shipId ? S.expenses.filter(e => e.ship === shipId) : [];
  const ship = shipId ? S.ships.find(s => s.id === shipId) : null;
  return { ship, items, sales, adjs, counts, exps, value: sum(sales, s => num(s.total)), paid: sum(sales, s => num(s.paid)), owed: sum(sales, s => Math.max(0, num(s.total) - num(s.paid))), pieces: sum(sales, s => num(s.qty)) };
}
async function retryCall(fn) {
  for (let k = 0; ; k++) {
    try { return await fn(); }
    catch (e) { const c = e && e.code; if (k < 4 && (c === 'unavailable' || c === 'resource_exhausted')) { await new Promise(r => setTimeout(r, 700 * (k + 1) + Math.random() * 500)); continue; } throw e; }
  }
}
async function runPurge(p, expMode, onStep) {
  const jobs = [];
  p.sales.forEach(s => jobs.push(() => S.db.doc('sales/' + s.id).delete()));
  p.adjs.forEach(a => jobs.push(() => S.db.doc('adjustments/' + a.id).delete()));
  p.counts.forEach(x => jobs.push(() => S.db.doc('counts/' + x.id).delete()));
  p.exps.forEach(e => jobs.push(() => expMode === 'delete' ? S.db.doc('expenses/' + e.id).delete() : S.db.doc('expenses/' + e.id).update({ ship: '' })));
  p.items.forEach(i => jobs.push(() => S.db.doc('items/' + i.id).delete()));
  const total = jobs.length + (p.ship ? 1 : 0); let done = 0;
  for (let i = 0; i < jobs.length; i += 4) {   // a few at a time, so the database is not flooded
    await Promise.all(jobs.slice(i, i + 4).map(j => retryCall(j).then(() => onStep(++done, total))));
  }
  if (p.ship) { await retryCall(() => S.db.doc('shipments/' + p.ship.id).delete()); onStep(++done, total); }
}

/* ---------- day's money (cash-up) ---------- */
function moneyFlows(date) {
  const rows = []; const nm = s => (S.items.find(i => i.id === s.itemId) || {}).name || s.name || '';
  S.sales.forEach(s => {
    const pays = s.payments || [];
    if (s.payment !== 'Credit' && s.date === date) {
      const atSale = num(s.paid) - sum(pays, p => num(p.amount));
      if (Math.abs(atSale) > 0.5) {
        if (s.payParts && s.payParts.length) { const tot = sum(s.payParts, p => num(p.amount)) || 1; let left = atSale;
          s.payParts.forEach((p, i) => { const a = i === s.payParts.length - 1 ? left : Math.round(atSale * num(p.amount) / tot); left -= a; rows.push({ method: p.method, amount: a, what: `${s.qty} × ${nm(s)}`, s }); }); }
        else rows.push({ method: s.payment || 'Cash', amount: atSale, what: `${s.qty} × ${nm(s)}`, s });
      }
    }
    pays.forEach(p => { if (p.date === date && Math.abs(num(p.amount)) > 0.5) rows.push({ method: p.method || 'Cash', amount: num(p.amount), what: (num(p.amount) < 0 ? 'Refund: ' : s.date === date ? '' : 'Credit payment: ') + `${s.qty} × ${nm(s)}${s.customer ? ' (' + s.customer + ')' : ''}`, s }); });
  });
  S.expenses.forEach(e => { if (e.date === date) rows.push({ method: e.method || 'Cash', amount: -num(e.amount), what: 'Expense: ' + e.category + (e.note ? ' (' + e.note + ')' : ''), e }); });
  return rows;
}
function dayTotals(date) {
  const rows = moneyFlows(date); const by = {};
  rows.forEach(x => { const m = x.method; by[m] = by[m] || { inn: 0, out: 0 }; if (x.amount >= 0) by[m].inn += x.amount; else by[m].out -= x.amount; });
  return { rows, by, methods: Object.keys(by).sort((a, b) => PAY_METHODS.indexOf(a) - PAY_METHODS.indexOf(b)) };
}

      <details style="margin-top:8px"><summary class="small">${t.rows.length} payment${t.rows.length === 1 ? '' : 's'} on this day</summary><div class="list">${t.rows.map(x => `<div class="li" style="grid-template-columns:1fr auto"><span class="small">${esc(x.method)} · ${esc(x.what)}</span><b class="small" style="color:${x.amount < 0 ? 'var(--low)' : 'inherit'}">${D(x.amount)}</b></div>`).join('')}</div></details>`

    ${cu ? `<p class="small" style="margin:8px 0 0">Closed by ${esc(whoName(cu.by))}${cu.note ? ' · ' + esc(cu.note) : ''}. ${Math.abs(num(cu.diff)) <= 0.5 ? '<span class="pill ok">Everything matches</span>' : `<span class="pill bad">${num(cu.diff) < 0 ? 'Short' : 'Over'} by ${D(Math.abs(num(cu.diff)))}</span>`}</p>` : ''}
    ${S.canWrite && t.methods.length ? `<button type="button" class="btn ${cu ? '' : 'primary'} block" style="margin-top:10px" data-act="cashup">${cu ? 'Count again' : 'Count and close the day'}</button>` : ''}

function sizeTokens(str) { const out = []; const re = /([A-Za-z0-9]+)\s*\((\d+)\)/g; let m; while ((m = re.exec(String(str || '')))) out.push({ size: m[1].toUpperCase(), n: +m[2] }); return out; }

function soldBySize(r, sales) {
  const opts = sizeOptions(r); const by = {}; let unknown = 0;
  sales.forEach(s => { const q = num(s.qty); if (q <= 0) return; const toks = String(s.size || '').toUpperCase().split(/[^A-Z0-9]+/).filter(t => opts.includes(t));

function insightRows(c) {
  const ship = c.ship; const start = ship.arrived || ship.ordered || today();
  const days = Math.max(1, -(daysUntil(start) || 0)); const weeks = Math.max(1, days / 7);
  return c.items.filter(r => r.forSale).map(r => {
    const ss = c.sales.filter(s => s.itemId === r.id && num(s.qty) > 0);
    const last = ss.reduce((m, s) => s.date > m ? s.date : m, '');
    const since = last ? -(daysUntil(last) || 0) : null;
    const rate = r.sold / weeks; const wLeft = rate > 0 ? r.left / rate : Infinity;
    let label = 'Steady';
    if (r.left <= 0) label = 'Sold out';
    else if (r.sold === 0) label = days >= 14 ? 'Not selling' : 'No sales yet';
    else if (r.thru >= 0.5 || wLeft <= 4) label = 'Fast';
    else if ((since != null && since >= 21) || wLeft > 16) label = 'Slow';
    return { r, ss, last, since, rate, wLeft, label, sizes: sizeOptions(r).length ? { bought: sizeTokens(r.sizes), ...soldBySize(r, ss) } : null };

}

function loadImg(src) { return new Promise(res => { if (!src) return res(null); const im = new Image(); im.onload = () => res(im); im.onerror = () => res(null); im.src = src; }); }

      c.fillText(name, cx + 12, cy + ph + 40);

/* ---------- monthly profit ---------- */
const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const monthName = ym => { const [y, m] = String(ym).split('-'); return (MONTHS[+m - 1] || ym) + ' ' + y; };
function costIndex() { const m = {}; S.ships.forEach(sh => calcShip(sh).items.forEach(r => { m[r.id] = r; })); return m; }
function unitCost(r, withEquip) { return r ? (withEquip ? r.cogsUnit : r.cogsOwn) : 0; }
function monthlyProfit(withEquip) {
  const idx = costIndex(); const by = {};
  const M = ym => by[ym] = by[ym] || { ym, sales: 0, cogs: 0, pieces: 0, write: 0, exp: 0, cash: 0, unknown: 0, groups: {}, expCats: {}, writes: [], items: {} };
  const ok = d => /^\d{4}-\d{2}/.test(String(d || ''));
  S.sales.forEach(s => {
    if (!ok(s.date)) return; const m = M(String(s.date).slice(0, 7)); const r = idx[s.itemId]; const q = num(s.qty);
    const c = q * unitCost(r, withEquip); if (!r && q) m.unknown++;
    m.sales += num(s.total); m.pieces += q; m.cogs += c;
    const g = (r && r.group) || 'Unknown item'; const G = m.groups[g] = m.groups[g] || { pieces: 0, sales: 0, cogs: 0 }; G.pieces += q; G.sales += num(s.total); G.cogs += c;
    const nm = (r && r.name) || s.name || '?'; const I = m.items[nm] = m.items[nm] || { pieces: 0, sales: 0, cogs: 0 }; I.pieces += q; I.sales += num(s.total); I.cogs += c;
    const pays = s.payments || [];
    if (s.payment !== 'Credit') m.cash += num(s.paid) - sum(pays, p => num(p.amount));
    pays.forEach(p => { if (ok(p.date)) M(String(p.date).slice(0, 7)).cash += num(p.amount); });
  });
  S.adjustments.forEach(a => { if (!ok(a.date)) return; const m = M(String(a.date).slice(0, 7)); const r = idx[a.itemId];
    const v = -num(a.qty) * (r ? unitCost(r, withEquip) : num(a.landed)); m.write += v; m.writes.push({ ...a, v }); });
  S.expenses.forEach(e => { if (!ok(e.date)) return; const m = M(String(e.date).slice(0, 7)); m.exp += num(e.amount); m.expCats[e.category || 'Other'] = (m.expCats[e.category || 'Other'] || 0) + num(e.amount); });
  return Object.values(by).map(m => ({ ...m, gross: m.sales - m.cogs, net: m.sales - m.cogs - m.write - m.exp })).sort((a, b) => b.ym.localeCompare(a.ym));
}

}

    const via = g('Sold via');

    const sub = { row: i + 2, ts, key, date: parseSheetDate(g('Date of sale')) || parseSheetDate(ts) || today(), payment, paidNow: Math.max(0, num(g('Paid now (D)'))),

function shrink(file) {
  return new Promise((res, rej) => { const fr = new FileReader(); fr.onerror = rej; fr.onload = () => { const im = new Image(); im.onerror = rej; im.onload = () => {
    const s = Math.min(im.width, im.height), cv = document.createElement('canvas'); cv.width = cv.height = 240; const cx = cv.getContext('2d');
    cx.drawImage(im, (im.width - s) / 2, (im.height - s) / 2, s, s, 0, 0, 240, 240); res(cv.toDataURL('image/jpeg', 0.72)); }; im.src = fr.result; }; fr.readAsDataURL(file); });
}

/* ---------- receipts ---------- */
function nextInvoiceNo(date, extra) {
  const d = String(date || today()), ymd = d.replace(/-/g, ''), p = 'R-' + ymd + '-', old = 'R' + ymd.slice(2) + '-';
  const used = S.sales.filter(x => x.date === d).map(x => x.invoiceNo).filter(Boolean).concat(extra || []);
  const nums = used.map(u => u.startsWith(p) ? parseInt(u.slice(p.length), 10) : u.startsWith(old) ? parseInt(u.slice(old.length), 10) : 0).filter(n => n > 0);
  let n = Math.max(0, S.sales.filter(x => x.date === d && !x.invoiceNo).length, ...nums) + 1;
  while (used.includes(p + String(n).padStart(3, '0'))) n++;
  return p + String(n).padStart(3, '0');
}
function receiptData(saleId, fresh) {
  const extra = fresh ? [].concat(fresh) : [];
  const pool = S.sales.concat(extra.filter(f => !S.sales.some(x => x.id === f.id)));
  const s = pool.find(x => x.id === saleId); if (!s) return null;
  const key = String(s.customer || '').trim().toLowerCase();
  // one receipt = one transaction (same receipt number); older sales without a number are grouped by customer and day
  const group = s.invoiceNo ? pool.filter(x => x.invoiceNo === s.invoiceNo) : s.orderId ? pool.filter(x => x.orderId === s.orderId)
    : key ? pool.filter(x => !x.invoiceNo && String(x.customer || '').trim().toLowerCase() === key && x.date === s.date) : [s];
  if (!group.some(x => x.id === s.id)) group.push(s);
  group.sort((a, b) => String(a.createdAt || '').localeCompare(String(b.createdAt || '')));
  const itemName = x => (S.items.find(i => i.id === x.itemId) || {}).name || x.name || '';
  const lines = group.filter(x => num(x.qty) > 0).map(x => ({ name: itemName(x), size: x.size || '', qty: num(x.qty), price: num(x.price), gross: num(x.qty) * num(x.price), total: num(x.total) }));
  const returns = []; group.forEach(x => (x.returns || []).forEach(rt => returns.push({ ...rt, name: itemName(x) })));
  const subtotal = sum(lines, l => l.gross), total = sum(group, x => num(x.total)), discount = Math.max(0, subtotal - total), paid = sum(group, x => num(x.paid)), due = Math.max(0, total - paid);
  const methods = new Set(); const hist = [];
  group.forEach(x => {
    if (x.payParts && x.payParts.length) x.payParts.forEach(p => methods.add(p.method));
    else if (x.payment && x.payment !== 'Credit') methods.add(x.payment);
    (x.payments || []).forEach(p => { if (num(p.amount) > 0) { methods.add(p.method || 'Cash'); hist.push(p); } });
  });
  const byDate = {}; hist.forEach(p => { const k = p.date + '|' + (p.method || 'Cash'); byDate[k] = (byDate[k] || 0) + num(p.amount); });
  const payHist = Object.entries(byDate).map(([k, a]) => { const [date, method] = k.split('|'); return { date, method, amount: a }; }).sort((a, b) => a.date.localeCompare(b.date));
  const cu = custOf(s) || group.map(custOf).find(Boolean) || null;
  const status = total <= 0.5 && returns.length ? 'returned' : due <= 0.5 ? 'paid' : paid > 0.5 ? 'part' : 'unpaid';
  const no = s.invoiceNo || group.find(x => x.invoiceNo)?.invoiceNo || ('R-' + String(s.date).replace(/-/g, '') + '-' + String(s.id).slice(-4).toUpperCase());
  return { no, date: s.date, time: saleTime(group[0]), customer: cu ? cu.name : (s.customer || ''), phone: (cu && cu.phone) || s.phone || (group.find(x => x.phone) || {}).phone || '', custCode: cu ? cu.code : (s.customerCode || ''),
    lines, returns, subtotal, discount, total, paid, due, status, kind: status === 'returned' ? 'RETURN RECEIPT' : status === 'paid' ? 'SALES RECEIPT' : 'INVOICE', pays: [...methods].join(', '), payHist: payHist.length > 1 ? payHist : [], count: group.length };
}

      if (b.dataset.ngdel) { const g = b.dataset.ngdel; delete W.newGroups[g]; W.items.forEach(it => { if (it.group === g) { it.group = ''; } }); redraw(); }
      if (b.id === 'wSave') await saveWizard(b);
    });
    async function saveWizard(btn) {
      btn.disabled = true;
      const shipId = target ? target.id : 's' + Date.now().toString(36);
      const used = new Set(S.items.filter(i => i.ship === shipId).map(i => i.code));
      const nextCode = grp => { const p = CODE_PREFIX[grp] || (String(grp).replace(/[^A-Za-z]/g, '').slice(0, 3).toUpperCase() || 'ITM'); for (let n = 1; ; n++) { const c = p + '-' + String(n).padStart(3, '0'); if (!used.has(c)) return c; } };
      const docs = W.items.map(it => { let code = String(it.code || '').toUpperCase().replace(/[^A-Z0-9_\-.~:@+]/g, '-').replace(/^-+|-+$/g, '');
        if (!code || used.has(code)) code = code && !used.has(code) ? code : nextCode(it.group); used.add(code);
        return [shipId + '-' + code, { ship: shipId, code, name: String(it.name).trim(), group: it.group, sizes: String(it.sizes || '').trim(), qty: Math.round(num(it.qty)), rmb: num(it.rmb), forSale: !!it.forSale, photo: it.photo || '', note: it.note || '' }]; });
      try {
        const newG = Object.fromEntries(Object.entries(W.newGroups).filter(([g]) => !groups.includes(g) && W.items.some(it => it.group === g)).map(([g, m]) => [g, num(m)]));
        if (Object.keys(newG).length) { btn.textContent = 'Adding new groups…'; await S.db.doc('settings/main').set({ ...ST(), markups: { ...(ST().markups || {}), ...newG } });
          logEvent('Added groups', 'settings', Object.entries(newG).map(([g, m]) => `${g} ${Math.round(m * 100)}%`).join(', ')); }
        if (!target) { await S.db.doc('shipments/' + shipId).set({ name: String(W.ship.name).trim() || 'New shipment', status: W.ship.status || 'Ordered', ordered: W.ship.ordered || today(), arrived: W.ship.arrived || '', planRate: num(W.ship.planRate),
          exchanges: W.exchanges.filter(x => num(x.gmd) > 0).map(x => ({ note: x.note || '', gmd: num(x.gmd), rate: num(x.rate) })), costs: W.costs.filter(x => num(x.gmd) > 0).map(x => ({ label: x.label || 'Cost', gmd: num(x.gmd) })),
          selling: { online: 0, rent: 0, months: 3, setup: 0 }, recoverPct: 1, goals: [], created: today() }); }
        for (let k = 0; k < docs.length; k++) { btn.textContent = `Saving item ${k + 1} of ${docs.length}…`; await S.db.doc('items/' + docs[k][0]).set(docs[k][1]); }
        if (!target) { S.shipId = shipId; S.wantShip = shipId; store.set('ship', shipId); }
        closeSheet(); toast(target ? `${docs.length} items added` : 'Shipment created'); S.tab = 'stock'; store.set('tab', 'stock'); render();
      } catch (err) { toast(errMsg(err) + ' Some items may already be saved; check Stock before trying again.'); btn.disabled = false; btn.textContent = 'Try again'; }
    }
  });
}

/* ---------- events ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('[data-tab],[data-act]'); if (!t) return;
  if (t.dataset.tab) { S.tab = t.dataset.tab; store.set('tab', S.tab); render(); window.scrollTo(0, 0); return; }
  const a = t.dataset.act, id = t.dataset.id;
  if (a === 'sale') { if (S.basket && S.tab === 'sell') basketAdd(id); else saleSheet(id); }
  else if (a === 'basketOn') { S.basket = []; S.basketForm = null; render(); }
  else if (a === 'basketGo') basketSheet();
  else if (a === 'basketClear') basketClear();
  else if (a === 'payCust') payCustSheet(id);
  else if (a === 'cust') custSheet(id);
  else if (a === 'month') monthSheet(id);
  else if (a === 'cashup') cashupSheet();
  else if (a === 'count') countSheet();
  else if (a === 'log') logSheet();
  else if (a === 'bkFile') downloadBackup(t);
  else if (a === 'catToggle') { const on = !catOn(); saveSettings({ catalog: { on, url: catLink() } }).then(ok => { if (!ok) return; logEvent(on ? 'Catalogue on' : 'Catalogue off', 'settings', on ? 'Public catalogue switched on' : 'Public catalogue switched off'); toast(on ? 'The catalogue is on' : 'The catalogue is off'); }); }
  else if (a === 'catCopy') { Promise.resolve().then(() => navigator.clipboard.writeText(catLink())).then(() => toast('Link copied'), () => toast('Could not copy. Press on the link to copy it.')); }
  else if (a === 'bkSheet') backupToSheet(t);
  else if (a === 'bkRestore') restoreSheet();
  else if (a === 'formSetup') formSetupSheet();
  else if (a === 'formImport') formImportSheet();
  else if (a === 'formItems') syncFormItems(t);
  else if (a === 'editSale') saleSheet(null, id);
  else if (a === 'receipt') receiptSheet(id);
  else if (a === 'pay') paySheet(id);
  else if (a === 'item') itemSheet(id);
  else if (a === 'newItem') itemSheet(null);
  else if (a === 'newExp') expSheet(null);
  else if (a === 'editExp') expSheet(id);
  else if (a === 'newShip') wizard('new');
  else if (a === 'bulkItems') wizard('items');
  else if (a === 'editShip') shipSheet(id);
  else if (a === 'editRules') rulesSheet();
  else if (a === 'editOrder') orderSheet();
  else if (a === 'priceCard') { S.priceCard = !S.priceCard; S.insights = false; render(); }
  else if (a === 'insights') { S.insights = !S.insights; S.priceCard = false; render(); }
  else if (a === 'priceList') priceListSheet();
  else if (a === 'remind') remindSheet(id);
  else if (a === 'grp') { S.stockGroup = t.dataset.g; render(); }
  else if (a === 'selMode') { S.selMode = !S.selMode; S.sel = new Set(); S.insights = false; S.priceCard = false; render(); }
  else if (a === 'selOff') { S.selMode = false; S.sel = new Set(); render(); }
  else if (a === 'selItem') { if (S.sel.has(id)) S.sel.delete(id); else S.sel.add(id); render(); }
  else if (a === 'selAll') { const ids = $$('[data-act="selItem"]').map(x => x.dataset.id); const all = ids.every(x => S.sel.has(x)); ids.forEach(x => all ? S.sel.delete(x) : S.sel.add(x)); render(); }
  else if (a === 'selDel') purgeSheet(null, [...S.sel], () => { S.selMode = false; S.sel = new Set(); })
  else if (a === 'csvSales') csv('sales'); else if (a === 'csvStock') csv('stock'); else if (a === 'csvExp') csv('exp');
});
document.addEventListener('input', e => {
  if (e.target.id === 'sellQ' || e.target.id === 'stockQ' || e.target.id === 'custQ') {
    const id = e.target.id, pos = e.target.selectionStart;
    if (id === 'sellQ') S.sellQ = e.target.value; else if (id === 'custQ') S.custQ = e.target.value; else S.stockQ = e.target.value;
    render(); const el = document.getElementById(id); if (el) { el.focus(); try { el.setSelectionRange(pos, pos); } catch {} }
  }
});
document.addEventListener('change', e => { if (e.target.id === 'cashDate') { S.cashDate = e.target.value || today(); render(); } if (e.target.id === 'pfEq') { S.profitEquip = e.target.checked; render(); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && $('#sheetRoot').innerHTML) closeSheet(); });
$('#shipPick').addEventListener('change', e => { S.shipId = e.target.value; S.selMode = false; S.sel = new Set(); store.set('ship', S.shipId); render(); });

async function hydrateNames() {
  if (!S.user || !S.user.profiles) return;
  const ids = [...new Set(S.sales.map(s => s.by).concat(S.log.map(x => x.by), S.cashups.map(x => x.by), S.adjustments.map(x => x.by)).filter(Boolean))].filter(id => !(id in S.names));
  if (!ids.length || hydrateNames.busy) return; hydrateNames.busy = true;
  try { const ps = await S.user.profiles(ids); ids.forEach(id => { S.names[id] = (ps && ps[id] && ps[id].name) || ''; }); schedule(); } catch {} finally { hydrateNames.busy = false; }
}

/* ---------- boot ---------- */
render();
(async () => {
  const use = window.claude && window.claude.use ? n => window.claude.use(n) : null;
  const db = use ? await use('db') : null;
  if (!db) { S.noDb = true; render(); return; }
  S.db = db;
  try { S.user = await use('user'); } catch {}
  if (!S.user) S.isOwner = true; // no way to tell: the access rules still protect prices and shipments
  if (S.user) { try { S.isOwner = !!(await S.user.isOwner()); } catch {} try { S.uid = await S.user.id(); } catch {} try { const w = await S.user.can('data.write'); if (w === false) S.canWrite = false; } catch {} }
  const onErr = e => { if (e && e.code === 'revoked') { S.canWrite = false; } schedule(); };
  db.doc('settings/main').onSnapshot(s => { S.settings = s.exists ? s.data() : null; S.got.settings = true; schedule(); }, onErr);
  const coll = (name, key) => db.collection(name).onSnapshot(q => { S[key] = q.docs.map(d => ({ ...d.data(), id: d.id })); S.got[key] = true; schedule(); }, onErr);
  coll('shipments', 'ships'); coll('items', 'items'); coll('sales', 'sales'); coll('expenses', 'expenses'); coll('customers', 'customers'); coll('adjustments', 'adjustments'); coll('cashups', 'cashups'); coll('counts', 'counts'); coll('log', 'log');
  db.doc('meta/backup').onSnapshot(s => { S.meta.backup = s.exists ? s.data() : null; schedule(); }, onErr);
  if (HOST()) db.doc('catalog/main').onSnapshot(s => { S.catalog = s.exists ? s.data() : null; S.got.catalog = true; schedule(); }, onErr);
  render();
})();
})();
</script>
