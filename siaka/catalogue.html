<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F3864">
<meta name="robots" content="noindex">
<title>SIAKA'S STORE · Products</title>
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&display=swap">
<script src="config.js"></script>
<style>
:root{--navy:#1F3864;--ink:#14202e;--muted:#5b6778;--line:#dfe5ee;--bg:#f3f5f9;--card:#fff;--ask:#1F3864;--target:#0f7a43;--target-soft:#e3f4ea;--gold:#f59e0b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 "Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--navy);color:#fff;padding:20px 16px 18px}
header .in,main{max-width:960px;margin:0 auto}
h1{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:28px;line-height:1.1;margin:0 0 4px;letter-spacing:-.01em}
.sub{opacity:.85;font-size:14px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.acts a{display:inline-flex;align-items:center;gap:6px;min-height:42px;padding:8px 14px;border-radius:999px;font-weight:700;text-decoration:none;font-size:15px}
.wa{background:#fff;color:var(--navy)}.call{border:1px solid rgba(255,255,255,.5);color:#fff}
main{padding:14px 16px 40px}
.tools{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 8px}
input[type=search]{width:100%;font:inherit;font-size:17px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#fff}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chips button{flex:none;font:inherit;font-size:14px;font-weight:700;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:6px 12px;min-height:36px;cursor:pointer}
.chips button[aria-pressed=true]{background:var(--navy);border-color:var(--navy);color:#fff}
.count{color:var(--muted);font-size:14px;margin:6px 0 10px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.ph{aspect-ratio:1/1;background:#eef2f6;display:flex;align-items:center;justify-content:center;color:var(--muted);font-weight:700;letter-spacing:.04em}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.body{padding:10px 12px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.nm{font-weight:700;line-height:1.25;overflow-wrap:anywhere}
.sz{font-size:13px;color:var(--muted)}
.pr{display:grid;gap:4px;margin-top:auto}
.pr>div{display:flex;justify-content:space-between;align-items:baseline;gap:6px;border-radius:9px;padding:5px 8px}
.pr .k{font-size:12px;font-weight:700}
.pr .v{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:17px;line-height:1.1;white-space:nowrap}
.p-price{background:#e8edf6;color:var(--ask)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:13px}
.left{font-weight:700;color:var(--muted)}
.ask{color:var(--navy);font-weight:700;text-decoration:none}
.msg{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px;text-align:center;color:var(--muted)}
.msg button{margin-top:12px;font:inherit;font-weight:700;border:0;border-radius:10px;background:var(--navy);color:#fff;padding:10px 18px;min-height:44px;cursor:pointer}
.note{color:var(--muted);font-size:13px;margin-top:18px;text-align:center}
.more{font:inherit;font-size:14px;font-weight:700;border:1px solid var(--navy);background:#fff;color:var(--navy);border-radius:10px;padding:6px 10px;min-height:40px;cursor:pointer;width:100%}
.more:hover{background:#e8edf6}
.badge{position:absolute;right:8px;bottom:8px;background:rgba(10,18,30,.72);color:#fff;font-size:12px;font-weight:700;border-radius:999px;padding:3px 8px}
.ph{position:relative}
.gal{position:relative;background:#eef2f6;margin-top:-60px}
.track{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.track::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;display:flex;align-items:center;justify-content:center;height:min(60vh,520px)}
.slide img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.slide.wait{color:var(--muted);font-weight:700;font-size:14px}
.gnav{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;border-radius:999px;border:0;background:rgba(255,255,255,.88);color:var(--ink);font-size:20px;font-weight:700;cursor:pointer;display:none}
.gnav.prev{left:8px}.gnav.next{right:8px}
.gcount{position:absolute;right:10px;bottom:10px;background:rgba(10,18,30,.72);color:#fff;font-size:13px;font-weight:700;border-radius:999px;padding:3px 9px}
@media (hover:hover){.gal.multi .gnav{display:block}}
.dlg h3{font-size:14px;margin:4px 0 0;color:var(--muted);text-transform:none}
.ph.tap{cursor:pointer}
.ov{position:fixed;inset:0;z-index:20;background:rgba(10,18,30,.6);display:flex;align-items:flex-end;justify-content:center}
.ov[hidden]{display:none}
.dlg{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:0 0 18px}
.dlg .top{position:sticky;top:0;z-index:3;display:flex;justify-content:flex-end;padding:8px;pointer-events:none}
.dlg .top .x{pointer-events:auto;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.dlg .x{font:inherit;font-weight:700;border:0;background:#eef2f6;color:var(--ink);border-radius:999px;min-width:44px;min-height:44px;cursor:pointer}
.dlg .in{padding:14px 16px 0;display:grid;gap:10px}
.dlg h2{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:22px;line-height:1.15;margin:0;overflow-wrap:anywhere}
.dlg .txt{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.5;margin:0}
.dlg .askbig{display:flex;align-items:center;justify-content:center;min-height:48px;border-radius:12px;background:var(--navy);color:#fff;font-weight:700;text-decoration:none}
@media (min-width:640px){.ov{align-items:center}.dlg{border-radius:18px}}
@media (min-width:640px){h1{font-size:34px}.grid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}}
</style>
</head>
<body>
<header><div class="in"><h1 id="nm">SIAKA'S STORE</h1><div class="sub" id="sub">Products in stock</div><div class="acts" id="acts"></div></div></header>
<main>
  <div class="tools" id="tools" hidden><input type="search" id="q" placeholder="Search: abaya, belt, 43…" aria-label="Search the products"><div class="chips" id="chips" role="group" aria-label="Groups"></div></div>
  <div class="count" id="count" aria-live="polite"></div>
  <div id="out"><div class="msg">Loading the products…</div></div>
  <p class="note">Prices in Dalasi. Stock changes during the day: ask us before you come.</p>
</main>
<div class="ov" id="ov" hidden><div class="dlg" id="dlg" role="dialog" aria-modal="true" aria-labelledby="dlgT"></div></div>
<script>
(function () {
  'use strict';
  var CFG = window.SHOP_CONFIG || {}, data = null, group = 'All';
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var D = function (n) { return 'D' + Math.round(Number(n) || 0).toLocaleString('en-US'); };
  var waNum = function (p) { var d = String(p || '').replace(/\D/g, ''); if (d.indexOf('00') === 0) d = d.slice(2); if (d.length === 7) d = '220' + d; return d; };
  function load() {
    $('out').innerHTML = '<div class="msg">Loading the products…</div>';
    fetch(CFG.api, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: 'catalogue', args: [] }), credentials: 'omit', cache: 'no-store' })
      .then(function (r) { return r.text(); })
      .then(function (t) { var o = JSON.parse(t); if (!o || !o.ok) throw new Error((o && o.error) || 'bad reply'); show(o.value); })
      .catch(function () { $('out').innerHTML = '<div class="msg">The products could not be loaded. Check the internet and try again.<br><button type="button" id="retry">Try again</button></div>'; $('retry').onclick = load; });
  }
  function show(v) {
    data = v || {};
    var name = data.business || CFG.name || 'Our shop';
    $('nm').textContent = name; document.title = name + ' · Products';
    if (data.off) { $('tools').hidden = true; $('count').textContent = ''; $('out').innerHTML = '<div class="msg">This catalogue is closed right now.</div>'; return; }
    var when = data.at ? new Date(data.at).toLocaleString('en-GB', { timeZone: 'Africa/Banjul', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : '';
    $('sub').textContent = [data.town, when ? 'updated ' + when : ''].filter(Boolean).join(' · ');
    var wa = waNum(data.phone), acts = '';
    if (wa) acts += '<a class="wa" href="https://wa.me/' + wa + '?text=' + encodeURIComponent('Hello ' + name + ', I saw your products.') + '" target="_blank" rel="noopener">WhatsApp us</a><a class="call" href="tel:+' + wa + '">Call ' + esc(data.phone) + '</a>';
    $('acts').innerHTML = acts;
    var groups = ['All'].concat((data.items || []).map(function (x) { return x.group; }).filter(function (g, i, a) { return g && a.indexOf(g) === i; }));
    $('chips').innerHTML = groups.length > 2 ? groups.map(function (g) { return '<button type="button" data-g="' + esc(g) + '" aria-pressed="' + (g === group) + '">' + esc(g) + '</button>'; }).join('') : '';
    $('tools').hidden = !(data.items || []).length;
    render();
  }
  function render() {
    var q = $('q').value.trim().toLowerCase(), wa = waNum(data.phone), name = data.business || CFG.name || '';
    var list = (data.items || []).filter(function (x) {
      return (group === 'All' || x.group === group) && (!q || (x.name + ' ' + x.code + ' ' + x.group + ' ' + x.sizes + ' ' + (x.desc || '')).toLowerCase().indexOf(q) >= 0);
    });
    $('count').textContent = (data.items || []).length ? list.length + ' product' + (list.length === 1 ? '' : 's') : '';
    if (!(data.items || []).length) { $('out').innerHTML = '<div class="msg">Nothing in stock to show right now. Come back soon.</div>'; return; }
    if (!list.length) { $('out').innerHTML = '<div class="msg">Nothing matches your search.</div>'; return; }
    shown = list;
    $('out').innerHTML = '<div class="grid">' + list.map(function (x, i) {
      var ph = x.photo ? '<img src="' + esc(x.photo) + '" alt="' + esc(x.name) + '" loading="lazy">' : esc(x.code || '');
      var askLink = wa ? '<a class="ask" href="' + askUrl(x) + '" target="_blank" rel="noopener">Ask us</a>' : '';
      var n = 1 + (Number(x.more) || 0);
      return '<article class="card"><div class="ph tap" data-i="' + i + '">' + ph + (x.photo && n > 1 ? '<span class="badge">' + n + ' photos</span>' : '') + '</div><div class="body"><div class="nm">' + esc(x.name) + '</div>' +
        '<div class="pr"><div class="p-price"><div class="k">Price</div><div class="v">' + D(x.price) + '</div></div></div>' +
        '<button type="button" class="more" data-i="' + i + '">Details</button>' +
        '<div class="foot"><span class="left">' + esc(leftText(x)) + '</span>' + askLink + '</div></div></article>';
    }).join('') + '</div>';
  }
  // pieces left as the owner chose: the number, "In stock", or "Only N left" when few (the server leaves hidden numbers out)
  function leftText(x) {
    var n = Number(x.left);
    if (x.left == null || !(n > 0)) return 'In stock';
    return data.leftMode === 'few' ? 'Only ' + n + ' left' : n + ' left';
  }
  function askUrl(x) {
    var name = data.business || CFG.name || '';
    return 'https://wa.me/' + waNum(data.phone) + '?text=' + encodeURIComponent('Hello ' + name + ', I am interested in ' + x.name + (x.code ? ' (' + x.code + ')' : '') + '.');
  }
  // the details of one product, over the list; the phone's Back button closes it
  var opened = false, lastFocus = null, extra = {}, showing = null;
  var okPhoto = function (p) { return typeof p === 'string' && /^data:image\/(jpeg|png|webp|gif);base64,[A-Za-z0-9+\/=]+$/.test(p); };
  function openDetails(x) {
    var wa = waNum(data.phone), more = Number(x.more) || 0; showing = x;
    $('dlg').innerHTML = '<div class="top"><button type="button" class="x" id="dlgX" aria-label="Close">✕</button></div>' +
      (x.photo || more ? '<div class="gal" id="gal"><div class="track" id="track"></div><button type="button" class="gnav prev" id="gPrev" aria-label="Previous photo">‹</button><button type="button" class="gnav next" id="gNext" aria-label="Next photo">›</button><span class="gcount" id="gCount" hidden></span></div>' : '') +
      '<div class="in"><h2 id="dlgT">' + esc(x.name) + '</h2>' +
      (x.code ? '<div class="sz">' + esc(x.code) + '</div>' : '') +
      '<div class="pr"><div class="p-price"><div class="k">Price</div><div class="v">' + D(x.price) + '</div></div></div>' +
      '<div class="left">' + esc(leftText(x)) + '</div>' +
      (x.sizes ? '<h3>Sizes / colours</h3><p class="txt">' + esc(x.sizes) + '</p>' : '') +
      (x.desc ? '<h3>Details</h3><p class="txt">' + esc(x.desc) + '</p>' : '') +
      (wa ? '<a class="askbig" href="' + askUrl(x) + '" target="_blank" rel="noopener">Ask about this on WhatsApp</a>' : '') + '</div>';
    drawGallery(x);
    if (more && !extra[x.pid]) {
      fetch(CFG.api, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: 'catalogPhotos', args: [x.pid] }), credentials: 'omit', cache: 'no-store' })
        .then(function (r) { return r.text(); }).then(function (t) { var o = JSON.parse(t); if (!o || !o.ok) throw new Error('bad reply'); extra[x.pid] = (o.value || []).filter(okPhoto); })
        .catch(function () { extra[x.pid] = null; })
        .then(function () { if (showing === x) drawGallery(x); if (extra[x.pid] === null) delete extra[x.pid]; });
    }
    lastFocus = document.activeElement; $('ov').hidden = false; document.body.style.overflow = 'hidden'; $('dlgX').focus();
    if (!opened) { opened = true; try { history.pushState({ details: 1 }, ''); } catch (e) {} }
  }
  // the photos of one product: the main one, then the catalogue photos (swipe, or the arrows on a computer)
  function drawGallery(x) {
    var tr = $('track'); if (!tr) return;
    var more = Number(x.more) || 0, got = extra[x.pid], list = (x.photo ? [x.photo] : []).concat(got || []);
    var slides = list.map(function (src, k) { return '<div class="slide"><img src="' + esc(src) + '" alt="' + esc(x.name) + ' photo ' + (k + 1) + '"></div>'; });
    if (more && got === undefined) slides.push('<div class="slide wait">Loading more photos…</div>');
    if (more && got === null) slides.push('<div class="slide wait">More photos could not be loaded. Check the internet.</div>');
    tr.innerHTML = slides.join('');
    var n = tr.children.length, c = $('gCount');
    $('gal').classList.toggle('multi', n > 1); c.hidden = n < 2;
    var at = function () { return Math.round(tr.scrollLeft / Math.max(1, tr.clientWidth)); };
    var upd = function () { c.textContent = Math.min(n, at() + 1) + ' / ' + n; };
    tr.onscroll = upd; upd();
    $('gPrev').onclick = function () { tr.scrollTo({ left: Math.max(0, at() - 1) * tr.clientWidth, behavior: 'smooth' }); };
    $('gNext').onclick = function () { tr.scrollTo({ left: Math.min(n - 1, at() + 1) * tr.clientWidth, behavior: 'smooth' }); };
  }
  function closeDetails(fromBack) {
    if ($('ov').hidden) return;
    $('ov').hidden = true; $('dlg').innerHTML = ''; document.body.style.overflow = ''; showing = null;
    if (opened) { opened = false; if (!fromBack) { try { history.back(); } catch (e) {} } }
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }
  var shown = [];
  $('out').addEventListener('click', function (e) { var b = e.target.closest('[data-i]'); if (b && shown[+b.getAttribute('data-i')]) openDetails(shown[+b.getAttribute('data-i')]); });
  $('ov').addEventListener('click', function (e) { if (e.target === $('ov') || e.target.closest('#dlgX')) closeDetails(false); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeDetails(false); });
  window.addEventListener('popstate', function () { closeDetails(true); });
  $('q').addEventListener('input', function () { if (data) render(); });
  $('chips').addEventListener('click', function (e) { var b = e.target.closest('[data-g]'); if (!b) return; group = b.getAttribute('data-g'); Array.prototype.forEach.call($('chips').children, function (c) { c.setAttribute('aria-pressed', c === b); }); render(); });
  if (!CFG.api) { $('out').innerHTML = '<div class="msg">This page is missing the store link.</div>'; return; }
  load();
})();
</script>
</body>
</html>
