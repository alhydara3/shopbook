<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap">
<style>
/* Layout: mobile-first shop ledger — sticky header with shipment picker, one screen per job, bottom tab bar on phones, top tabs on wide screens. */
:root{
  --bg:#eef2f6; --surface:#ffffff; --surface-2:#f6f8fb; --ink:#14202e; --muted:#5a6878; --line:#d9e0e8;
  --head:#1f3864; --brand:#1f3864; --brand-ink:#ffffff; --brand-soft:#e3eaf5; --link:#1f4f9a;
  --ask:#1f3864; --target:#1b7f3b; --target-soft:#e7f4ec; --low:#b3261e; --low-soft:#fbeceb;
  --warn:#9a5a00; --warn-soft:#fff3dc; --ok:#1b7f3b;
  --shadow:0 1px 2px rgba(20,32,46,.06),0 4px 14px rgba(20,32,46,.06);
  --f-display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e151d; --surface:#16202b; --surface-2:#1b2733; --ink:#e6edf4; --muted:#9aa9b9; --line:#2a3846;
  --head:#172947; --brand:#3a6bc4; --brand-ink:#ffffff; --brand-soft:#1d2c44; --link:#8fb4ff;
  --ask:#9ec0ff; --target:#5fd08f; --target-soft:#15301f; --low:#ff8f86; --low-soft:#3a1c1b;
  --warn:#f2b552; --warn-soft:#3a2c12; --ok:#5fd08f; --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e151d; --surface:#16202b; --surface-2:#1b2733; --ink:#e6edf4; --muted:#9aa9b9; --line:#2a3846;
  --head:#172947; --brand:#3a6bc4; --brand-ink:#ffffff; --brand-soft:#1d2c44; --link:#8fb4ff;
  --ask:#9ec0ff; --target:#5fd08f; --target-soft:#15301f; --low:#ff8f86; --low-soft:#3a1c1b;
  --warn:#f2b552; --warn-soft:#3a2c12; --ok:#5fd08f; --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;margin:0;font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--link)}
.wrap{max-width:1040px;margin:0 auto;padding-inline:16px;padding-block:0 110px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--head);color:var(--brand-ink)}
.top-in{max-width:1040px;margin:0 auto;padding:12px 16px 10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.top h1{font-size:21px;font-weight:800;flex:1 1 auto;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top h1 small{display:block;font-family:var(--f-body);font-weight:400;font-size:12px;opacity:.8;letter-spacing:0}
.top select{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:10px;padding:7px 10px;max-width:100%;font-size:14px}
.top select option{color:#14202e}
.who{font-size:12px;opacity:.85}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs button{background:none;border:0;padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--muted);cursor:pointer}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button[aria-current="page"]{color:var(--brand);font-weight:700}
:root[data-theme="dark"] nav.tabs button[aria-current="page"]{color:var(--ask)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) nav.tabs button[aria-current="page"]{color:var(--ask)}}
nav.tabs button:focus-visible,.btn:focus-visible,.chip:focus-visible,.card-btn:focus-visible{outline:3px solid var(--link);outline-offset:2px}
@media (min-width:760px){
  nav.tabs{position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);bottom:auto;border:0;border-bottom:1px solid var(--line);max-width:1040px;margin:0 auto;background:var(--bg);padding:0 16px}
  nav.tabs button{flex-direction:row;justify-content:center;font-size:14px;padding:12px 4px;gap:7px;border-bottom:3px solid transparent}
  nav.tabs button[aria-current="page"]{border-bottom-color:var(--brand)}
  .wrap{padding-block:0 40px}
}
section.screen{display:grid;gap:16px;padding-top:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);min-width:0}
.panel h2{font-size:19px;font-weight:700}
.panel h3{font-size:16px;font-weight:700}
.muted{color:var(--muted)}
.small{font-size:13.5px}
.label{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.big{font-family:var(--f-display);font-size:30px;font-weight:800;line-height:1.1}
.grid-tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;min-width:0}
.tile .v{font-family:var(--f-display);font-size:24px;font-weight:800;margin-top:2px}
.tile .s{font-size:13px;color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:10px;border:1px solid var(--line);background:var(--surface);padding:10px 14px;cursor:pointer;font-weight:700;min-height:44px}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.danger{color:var(--low);border-color:var(--low)}
.btn.ghost{background:transparent}
.btn.block{width:100%}
a.btn{text-decoration:none}
.btn.lg{font-size:18px;min-height:54px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.cpl{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}
.cpl .cp{position:relative;width:84px;height:84px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.cpl .cp img{width:100%;height:100%;object-fit:cover;display:block}
.cpl .cp button{position:absolute;top:3px;right:3px;width:28px;height:28px;min-height:28px;padding:0;border-radius:999px;border:0;background:rgba(10,18,30,.75);color:#fff;font-weight:700;cursor:pointer}
.cvnow{display:flex;gap:10px;align-items:center;margin:6px 0}.cvnow img{width:84px;height:84px;object-fit:cover;border-radius:10px;border:1px solid var(--line)}
.cvbar{height:8px;border-radius:999px;background:var(--line);overflow:hidden;margin-top:6px}.cvbar>i{display:block;height:100%;background:var(--target);width:0}
.idesc{white-space:pre-wrap;overflow-wrap:anywhere;font-size:14px;line-height:1.45;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0}
.pill{display:inline-block;border-radius:999px;padding:2px 9px;font-size:12px;font-weight:700;background:var(--brand-soft);color:var(--ask)}
.pill.ok{background:var(--target-soft);color:var(--target)}
.pill.bad{background:var(--low-soft);color:var(--low)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.prog{height:14px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);position:relative;overflow:visible}
.prog>i{position:absolute;left:0;top:0;bottom:0;border-radius:999px;background:var(--target)}
.prog .mark{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--ink);opacity:.55}
.goals{display:grid;gap:6px;margin-top:10px}
.goal{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;font-size:14px}
.dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--muted)}
.dot.done{background:var(--target);border-color:var(--target)}
.list{display:grid}
.li{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);min-width:0}
.li:last-child{border-bottom:0}
.li .t{font-weight:700;min-width:0;overflow-wrap:anywhere}
.thumb{width:52px;height:52px;border-radius:10px;object-fit:cover;background:var(--surface-2);border:1px solid var(--line);display:grid;place-items:center;color:var(--muted);font-size:11px;text-align:center;overflow:hidden}
.thumb.lg{width:76px;height:76px}
.items-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.card-btn{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:8px;text-align:left;cursor:pointer;display:grid;gap:6px;min-width:0}
.card-btn img,.card-btn .ph{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px;background:var(--surface-2);max-width:100%}
.card-btn .ph{display:grid;place-items:center;color:var(--muted);font-size:13px}
.card-btn .n{font-weight:700;font-size:14px;line-height:1.25}
.card-btn.out{opacity:.5}
.card-btn{position:relative}
.card-btn .inb{position:absolute;top:14px;left:14px;background:var(--brand);color:var(--brand-ink);font-weight:800;font-size:13px;border-radius:999px;padding:3px 10px;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.card-btn.inb-on{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand)}
.bbar{position:fixed;left:0;right:0;bottom:calc(60px + env(safe-area-inset-bottom,0px));z-index:25;padding:0 12px 8px;pointer-events:none}
.bbar-in{pointer-events:auto;max-width:640px;margin:0 auto;background:var(--head);color:#fff;border-radius:14px;padding:10px 12px;display:flex;gap:8px;align-items:center;box-shadow:0 6px 20px rgba(0,0,0,.28)}
.bbar-in .grow{flex:1;min-width:0;font-weight:800;font-size:17px}
.bbar-in .grow small{display:block;font-weight:400;font-size:12.5px;opacity:.85}
.bbar-in .btn{min-height:44px}
.bbar-in .go{background:#fff;color:#14202e;border-color:#fff}
.bbar-in .cx{background:transparent;color:#fff;border-color:rgba(255,255,255,.45)}
.bline{display:grid;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}
.bline:first-child{padding-top:0}
@media (min-width:760px){.bbar{bottom:16px}}
.prices{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}
.prices div{border-radius:8px;padding:6px 2px}
.prices .k{font-size:10.5px;letter-spacing:.06em;font-weight:700;text-transform:uppercase}
.prices .v{font-weight:800;font-size:15px}
.p-ask{color:var(--ask)} .p-target{color:var(--target);background:var(--target-soft)} .p-low{color:var(--low)}
.pc .prices .v{font-size:21px}
.bar{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;background:var(--brand)}
.alert{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:10px 12px;border-radius:10px;font-size:14.5px}
.alert.bad{background:var(--low-soft);color:var(--ink)} .alert.warn{background:var(--warn-soft)} .alert.info{background:var(--brand-soft)}
.alert b.i{font-family:var(--f-display)}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{background:var(--surface-2);font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
td.n,th.n{text-align:right}
tr:last-child td{border-bottom:0}
label.f{display:grid;gap:5px;font-size:14px;font-weight:700;min-width:0}
label.f span.h,div.f span.h{font-weight:400;color:var(--muted);font-size:13px}
div.f.cpbox{display:grid;gap:5px;font-size:14px;min-width:0}div.f.cpbox>b{font-weight:700}
input,select,textarea{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface);min-height:44px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:3px solid color-mix(in srgb,var(--link) 45%,transparent);border-color:var(--link)}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px;cursor:pointer;min-height:44px}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand);font-weight:700}
.stepper{display:grid;grid-template-columns:48px 1fr 48px;gap:6px}
.stepper button{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;font-size:22px;cursor:pointer}
.stepper input{text-align:center;font-weight:700;font-size:18px}
.sheet-back{position:fixed;inset:0;background:rgba(10,16,24,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px));display:grid;gap:14px}
@media (min-width:760px){.sheet-back{align-items:center}.sheet{border-radius:16px;max-height:88%}}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:10px;position:sticky;top:-16px;background:var(--bg);padding-block:4px;z-index:1}
.sheet-head h2{font-size:20px}
.x{border:0;background:var(--surface);border-radius:50%;width:40px;height:40px;font-size:22px;cursor:pointer;border:1px solid var(--line)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:60;font-weight:700;max-width:calc(100% - 32px)}
.empty{text-align:center;padding:28px 12px;color:var(--muted)}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 14px;font-size:15px}
.kv .tot{font-weight:800;border-top:1px solid var(--line);padding-top:6px}
.two{display:grid;gap:16px}
@media (min-width:860px){.two{grid-template-columns:1.25fr 1fr;align-items:start}}
.editrow{display:grid;grid-template-columns:1fr 110px 90px 40px;gap:6px;align-items:center}
.editrow.c3{grid-template-columns:1fr 130px 40px}
.editrow.fl{grid-template-columns:1fr 90px 90px 40px}
@media (max-width:480px){.editrow.fl{grid-template-columns:1fr 1fr 40px}}
.editrow.g{grid-template-columns:1fr 120px 80px 40px}
.editrow button{border:1px solid var(--line);background:var(--surface);border-radius:8px;height:40px;cursor:pointer;color:var(--low)}
@media (max-width:480px){.editrow,.editrow.g{grid-template-columns:1fr 1fr 40px}.editrow > :first-child,.editrow.g > :first-child{grid-column:1/-1}}
.note{font-size:13.5px;color:var(--muted)}
.icard{border:1px solid var(--line);border-radius:var(--r);padding:10px;display:grid;gap:8px;background:var(--surface-2);min-width:0}
.icard label.thumb{display:grid;place-items:center;text-align:center;font-size:12px;padding:4px}
.confirm{border:2px solid var(--low);border-radius:10px;padding:10px;background:var(--low-soft)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
</style>
